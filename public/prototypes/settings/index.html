<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ling Canvas · 设置交互预览</title>
<style>
:root{color-scheme:dark;--bg:#171719;--panel:#202023;--card:#171719;--input:#2b2b30;--line:#35353d;--text:#efeff3;--muted:#969aa8;--accent:#8ae3c6;--blue:#89aefa;--side:#25252a;--soft:#263b34}*{box-sizing:border-box}body{margin:0;font:13px/1.5 'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text)}body.light{color-scheme:light;--bg:#f8fafc;--panel:#fff;--card:#fff;--input:#f3f5f8;--line:#e1e6ee;--text:#202838;--muted:#8490a3;--accent:#40b791;--blue:#397beb;--side:#f7f9fc;--soft:#e8f8f1}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px}button:hover{background:var(--input)}.primary{background:var(--accent);color:#14382a;border-color:transparent}.primary:hover{filter:brightness(.96);background:var(--accent)}.appbar{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--card)}.brand{font-weight:650;letter-spacing:.3px}.brand i{color:#39d783;font-style:normal;margin-right:8px}.preview{font-size:11px;color:var(--muted)}.stage{position:relative;min-height:calc(100vh - 40px);padding:28px 5vw;background:radial-gradient(ellipse at 80% 80%,#27332f22,transparent 60%)}.canvas-name{color:var(--muted);position:absolute;left:24px;top:12px}.shell{position:relative;margin:8px auto;width:min(1180px,100%);height:min(820px,calc(100vh - 104px));min-height:560px;background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:0 28px 100px #0005;overflow:hidden;display:flex;flex-direction:column}.head{height:58px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.head strong{font-size:16px}.head small{margin-left:12px;color:var(--muted);font-weight:400;font-size:11px}.head button{border:0;color:var(--muted)}.layout{display:flex;flex:1;min-height:0}.nav{width:188px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column}.nav-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 12px 12px}.nav button{border:0;text-align:left;display:flex;gap:10px;align-items:center;margin:3px 0;padding:11px 12px;color:var(--muted)}.nav button.active{background:var(--input);color:var(--text)}.nav button.active:before{content:'';width:3px;height:18px;background:var(--accent);position:absolute;left:0;border-radius:2px}.nav svg,.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}.nav-foot{margin-top:auto;padding:12px;color:var(--muted);font-size:11px}.main{flex:1;min-width:0;overflow:auto;padding:24px 28px 32px}.page-title{display:flex;min-height:40px;justify-content:space-between;align-items:center;margin-bottom:20px}.page-title h1{font-size:21px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px}.section{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:18px;margin-top:16px}.section h2{font-size:14px;margin:0 0 5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.provider-pills{display:flex;gap:8px;flex-wrap:wrap}.provider-pills button{display:flex;gap:9px;align-items:center}.provider-pills button.active{background:var(--soft);border-color:#67b89988}.dot{width:6px;height:6px;border-radius:50%;background:#3bd790}.avatar{width:32px;height:32px;border-radius:9px;background:var(--input);display:grid;place-items:center;color:var(--muted);font-weight:bold}.provider-name{display:flex;gap:10px;align-items:center}.badge{font-size:11px;border-radius:20px;background:var(--soft);color:var(--accent);padding:4px 9px}.grid{display:grid;grid-template-columns:1fr 1.7fr;gap:14px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}input,select{width:100%;border:1px solid transparent;border-radius:7px;background:var(--input);padding:9px 11px;outline:none}input:focus,select:focus{border-color:var(--accent)}.full{margin-top:13px}.key{display:flex;gap:6px}.key button{white-space:nowrap}details{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;color:var(--muted)}summary{cursor:pointer;font-size:12px}details .grid{margin-top:12px}.searchline{display:flex;gap:8px;align-items:center;margin-bottom:12px}.searchline input{flex:1}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 14px}.tabs button{font-size:11px;padding:5px 10px}.tabs .active{color:var(--blue);border-color:var(--blue);background:var(--input)}.models{display:grid;grid-template-columns:1fr 1fr;gap:8px}.model{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:12px}.model .icon{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;background:#748ffb19;color:var(--blue)}.model strong{font-size:12px;display:block}.model small{color:var(--muted);font-size:10px}.model .type{margin-left:auto;color:var(--muted);font-size:10px}.switch{width:32px;height:18px;border:0;border-radius:12px;background:#56565d;padding:0;position:relative;flex-shrink:0}.switch:after{content:'';position:absolute;width:12px;height:12px;left:3px;top:3px;border-radius:50%;background:white;transition:left .15s}.switch.on{background:var(--accent)}.switch.on:after{left:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0;padding-bottom:0}.row:first-child{padding-top:0}.row strong{font-size:13px;font-weight:500}.row p{color:var(--muted);font-size:11px;margin:4px 0 0}.row select{width:180px}.row input[type=range]{width:150px;accent-color:var(--accent)}.row .value{color:var(--accent)}.callout{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--soft);font-size:11px;color:var(--muted)}.mini{font-size:11px;color:var(--muted)}.danger{color:#e88a8a}.footer-note{font-size:11px;color:var(--muted);margin-top:16px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:10px;padding:11px 20px;box-shadow:0 8px 30px #0004;z-index:30;display:none}.empty{color:var(--muted);padding:24px;grid-column:1/-1;text-align:center}.bar{width:180px;height:5px;background:var(--input);border-radius:5px;overflow:hidden}.bar div{background:var(--accent);width:38%;height:100%}@media(max-width:850px){.stage{padding:12px}.shell{height:calc(100vh - 66px);min-height:500px}.nav{width:150px}.main{padding:20px 16px}.models,.grid{grid-template-columns:1fr}.section-head{flex-wrap:wrap}.row select{width:140px}.head small{display:none}}
.switching .section{animation:providerFade .2s ease}@keyframes providerFade{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.switching .section{animation:none}}</style></head><body>
<div class="appbar"><div class="brand"><i>▦</i>Ling Canvas</div><span class="preview">设置 · 交互预览</span><span class="mini">—　▢　×</span></div>
<div class="stage"><span class="canvas-name">20261004_意式极简</span><div class="shell"><header class="head"><strong>设置 <small>让画布按你的习惯工作</small></strong><button id="themeTop" title="切换预览主题">☼　浅色预览</button></header><div class="layout"><aside class="nav"><div class="nav-label">偏好与配置</div><div id="nav"></div><div class="nav-foot">Ling Canvas 2.0.0<br>本地工作空间<br><br>此页面为设计预览<br>不连接 API，不修改软件设置</div></aside><main class="main" id="main"></main></div></div></div><div id="toast" class="toast" role="status"></div>
<script>
const paths={models:'M4 5h16v14H4Z M8 9h8 M8 13h5',canvas:'M3 3h7v7H3Z M14 3h7v7h-7Z M3 14h7v7H3Z M14 14h7v7h-7Z',media:'M3 4h18v16H3Z M3 16l5-5 4 4 4-6 5 7',agent:'M6 7h12v12H6Z M12 3v4 M3 11h3 M18 11h3 M9 11h1 M14 11h1 M9 15h6',shortcuts:'M3 6h18v12H3Z M6 9h1 M10 9h1 M14 9h1 M18 9h1 M7 14h10',about:'M12 8h.01 M12 11v6 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20'};
const icon=k=>`<svg viewBox="0 0 24 24"><path d="${paths[k]}" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const pages=[['models','模型服务'],['canvas','画布偏好'],['media','素材与存储'],['agent','智能体'],['shortcuts','快捷键'],['about','关于']];
let page='models',provider='linkapi',filter='全部',query='',onlyEnabled=false;
const models=[{name:'gemini-3.1-flash-image',id:'gemini-3.1-flash-image',type:'图像',on:true},{name:'gemini-3-pro-image',id:'gemini-3-pro-image',type:'图像',on:true},{name:'GPT Image',id:'gpt-image-1',type:'图像',on:false},{name:'Claude Sonnet',id:'claude-sonnet-4-5',type:'文本',on:true},{name:'Claude Haiku',id:'claude-haiku-4-5',type:'文本',on:false},{name:'GPT',id:'gpt-4.1',type:'文本',on:false}];
const providerModels={linkapi:models,chatfire:models.map((m,i)=>({...m,on:i===0||i===3}))};
const settings={};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2300)}
function title(t,sub,extra=''){return `<div class="page-title"><div><h1>${t}</h1></div>${extra}</div>`}
function section(t,sub,body){return `<section class="section"><div class="section-head"><div><h2>${t}</h2>${sub?``:''}</div></div>${body}</section>`}
function toggle(id,on){return `<button class="switch ${settings[id]??on?'on':''}" role="switch" aria-checked="${settings[id]??on}" aria-label="${id}" data-switch="${id}"></button>`}
function row(t,sub,control){return `<div class="row"><div><strong>${t}</strong><p>${sub}</p></div>${control}</div>`}
function select(id,items){return `<select data-setting="${id}" aria-label="${id}">${items.map((x,i)=>`<option ${settings[id]===x||!settings[id]&&i===0?'selected':''}>${x}</option>`).join('')}</select>`}
function render(){document.getElementById('nav').innerHTML=pages.map(([key,label])=>`<button class="${page===key?'active':''}" data-page="${key}">${icon(key)}${label}</button>`).join('');const main=document.getElementById('main');main.innerHTML=content();if(page==='models'){main.classList.remove('switching');void main.offsetWidth;main.classList.add('switching')}bind();if(page==='models')renderModels()}
function content(){
if(page==='models')return title('模型服务','管理 API 来源与画布中可用的模型',`<button data-action="addProvider">＋ 添加供应商</button>`)+`<div class="provider-pills"><button data-provider="chatfire" class="${provider==='chatfire'?'active':''}"><span class="avatar">火</span>火宝 (Chatfire)<span class="dot"></span></button><button data-provider="linkapi" class="${provider==='linkapi'?'active':''}"><span class="avatar">L</span>linkapi<span class="dot"></span></button></div><section class="section"><div class="section-head"><div class="provider-name"><span class="avatar">${provider==='linkapi'?'L':'火'}</span><div><h2>${provider==='linkapi'?'linkapi':'火宝 (Chatfire)'}</h2><span class="mini">接口配置</span></div></div><div><span class="badge" id="connection">● 连接成功 · 示例</span> <button class="primary" data-action="save">保存配置</button> <button data-action="test">测试连接</button></div></div><div class="grid"><div class="field"><label>供应商名称</label><input data-setting="${provider}-name" value="${provider==='linkapi'?'linkapi':'火宝 (Chatfire)'}"></div><div class="field"><label>接口地址 Base URL</label><input data-setting="${provider}-url" value="${provider==='linkapi'?'https://linkapi.ai':'https://api.chatfire.site'}"></div></div><div class="field full"><label>API Key</label><div class="key"><input id="apiKey" type="password" value="preview-key-not-a-real-secret" autocomplete="off"><button data-action="key">显示</button></div></div><details><summary>高级配置 · 渠道兼容性</summary><div class="grid"><div class="field"><label>图像请求通道</label>${select('图像请求通道',['供应商默认','OpenAI Images','Gemini 原生'])}</div><div class="field"><label>请求超时</label>${select('请求超时',['180 秒','300 秒','600 秒'])}</div></div><p class="mini">按供应商单独配置，适配不同的请求格式。</p></details></section><section class="section"><div class="section-head"><div><h2>可用模型 <span class="badge" id="enabledCount"></span></h2><div class="sub">启用后出现在画布的模型选择器中，开关即时保存</div></div><button data-action="refresh">↻ 刷新模型</button></div><div class="searchline"><input id="modelSearch" placeholder="搜索模型名称或 ID" aria-label="搜索模型"><button id="onlyEnabled" class="${onlyEnabled?'primary':''}">已启用</button></div><div class="tabs">${['全部','图像','文本','视频'].map(t=>`<button data-filter="${t}" class="${filter===t?'active':''}">${t}</button>`).join('')}</div><div id="models" class="models"></div><div class="footer-note">模型与供应商分别绑定，同名模型保留各自的通道配置。此列表为示例数据。</div></section>`;
if(page==='canvas')return title('画布偏好','调整外观与操作习惯')+section('外观','',row('主题','与主页、节点和工具栏统一',select('主题',['深色','浅色','跟随系统']))+row('画布背景','当前采用纯色背景',select('画布背景',['纯色','点阵','网格']))+row('图片与预览','先显示预览图，原图在后台读取',toggle('优先显示预览图',true)))+section('移动与缩放','',row('画布平移','保留当前操作习惯',select('画布平移',['空格 + 拖动 / 鼠标中键','鼠标左键拖动']))+row('滚轮行为','触控板也可独立调整',select('滚轮行为',['缩放画布','上下移动画布']))+row('缩放灵敏度','控制每次滚轮缩放的幅度',`<input aria-label="缩放灵敏度" type="range" min="1" max="10" value="5">`)+row('对齐辅助线','移动节点时帮助对齐',toggle('对齐辅助线',true))+row('自动吸附','节点靠近时吸附到对齐位置',toggle('自动吸附',false)))+section('保存','',row('自动保存','停止编辑后自动保存到本机',toggle('自动保存',true))+row('离开画布前检查','存在未保存修改时提醒',toggle('离开画布前检查',true)))+`<div class="footer-note">对齐辅助线与自动吸附为拟新增功能，需要后续实现。</div>`;
if(page==='media')return title('素材与存储','管理本地素材、预览缓存和项目备份')+section('素材库','',row('素材目录',String.raw`G:\02-设计素材库`,`<button data-action="path">更改目录</button>`)+row('目录可见性','隐藏不需要的目录，可随时恢复',`<button data-action="folders">管理目录</button>`)+row('重新扫描','同步磁盘中新添加的素材',`<button data-action="scan">重新扫描</button>`))+section('图片缓存','',row('预加载最近画布','在主页提前读取常用画布的预览',toggle('预加载最近画布',true))+row('内存缓存上限','限制图片缓存占用',select('内存缓存上限',['64 MB','128 MB','256 MB']))+row('磁盘预览缓存','示例占用 186 MB，不包含原始图片',`<button data-action="cache">清理预览缓存</button>`))+section('项目备份 · 拟新增','',row('自动备份','按天保留项目副本',toggle('自动备份',false))+row('保留时间','超出时间的自动备份会轮换',select('保留时间',['30 天','7 天','90 天']))+row('手动备份','导出全部项目与媒体',`<button data-action="backup">导出备份</button>`))+`<div class="callout">素材库以引用方式使用原文件。目录隐藏和预览缓存清理不会删除原文件。</div>`;
if(page==='agent')return title('智能体','配置画布助手与对话偏好')+section('连接','',row('本地 Claude Code','沿用现有软件的本地智能体连接',`<span class="badge">● 已连接 · 示例</span>`)+row('程序路径','自动检测，也可指定程序位置',`<button data-action="path">选择路径</button>`)+row('连接诊断','检查本地程序和登录状态',`<button data-action="test">检查连接</button>`))+section('对话与上下文','',row('携带选中节点','发送时读取选中节点及其连接关系',toggle('携带选中节点',true))+row('对话历史','自动保留对话内容',toggle('保存对话历史',true))+row('历史记录管理','重命名、归档、恢复',`<button data-action="history">查看历史</button>`)+row('回复语言','设置默认回复语言',select('回复语言',['简体中文','跟随输入','English'])))+`<div class="callout">本地智能体与图片生成的 API 供应商分别配置。</div>`;
if(page==='shortcuts')return title('快捷键','集中查看画布操作')+section('常用操作','以下为预览示例，正式实现时与现有快捷键表统一',row('搜索画布与素材','',`<kbd>Ctrl + K</kbd>`)+row('平移画布','',`<kbd>Space + 拖动</kbd>`)+row('多选节点','',`<kbd>Ctrl / Shift + 点击</kbd>`)+row('撤销 / 重做','',`<kbd>Ctrl + Z / Ctrl + Shift + Z</kbd>`)+row('删除选中节点','',`<kbd>Delete</kbd>`)+row('保存画布','',`<kbd>Ctrl + S</kbd>`));
return title('关于','Ling Canvas · 个人创作工作空间')+section('Ling Canvas','',row('当前版本','设计预览基于当前 2.0.0 界面',`<span class="badge">v2.0.0</span>`)+row('诊断信息','便于定位保存、图片加载和连接问题',`<button data-action="logs">导出诊断</button>`))+`<div class="callout">本页面只模拟设计与交互。所有连接状态、缓存大小和模型列表均为示例。</div>`;
}
function renderModels(){const list=providerModels[provider];document.getElementById('enabledCount').textContent='已启用 '+list.filter(m=>m.on).length+' 个';document.getElementById('models').innerHTML=list.map((m,i)=>({...m,i})).filter(m=>(filter==='全部'||m.type===filter)&&(!onlyEnabled||m.on)&&(m.name+' '+m.id).toLowerCase().includes(query.toLowerCase())).map(m=>`<div class="model"><span class="icon">${icon(m.type==='图像'?'media':'agent')}</span><div><strong>${m.name}</strong>${m.id!==m.name?`<small>${m.id}</small>`:''}</div><span class="type">${m.type}</span><button class="switch ${m.on?'on':''}" data-model="${m.i}" role="switch" aria-label="启用 ${m.name}" aria-checked="${m.on}"></button></div>`).join('')||'<div class="empty">没有符合条件的模型</div>';document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{list[b.dataset.model].on=!list[b.dataset.model].on;renderModels();toast('模型开关已更新 · 仅预览')})}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{provider=b.dataset.provider;query='';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();document.getElementById('modelSearch').value=query});document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{settings[b.dataset.switch]=!b.classList.contains('on');b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'));toast('偏好已更新 · 仅预览')});document.querySelectorAll('[data-setting]').forEach(el=>el.onchange=()=>{settings[el.dataset.setting]=el.value;if(el.dataset.setting==='主题'&&el.value!=='跟随系统'){document.body.classList.toggle('light',el.value==='浅色');syncTheme()}toast('设置已更新 · 仅预览')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b));const search=document.getElementById('modelSearch');if(search){search.value=query;search.oninput=()=>{query=search.value;renderModels()};document.getElementById('onlyEnabled').onclick=()=>{onlyEnabled=!onlyEnabled;render()}}}
function action(b){const a=b.dataset.action;if(a==='key'){const input=document.getElementById('apiKey');input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'显示':'隐藏';return}if(a==='test'){b.disabled=true;b.textContent='检测中…';setTimeout(()=>{b.disabled=false;b.textContent='测试连接';toast('模拟检测成功，未发送网络请求')},650);return}if(a==='folders'){alert('目录管理预览\n\n01-意式极简　显示\n02-法式风格　显示\n设计素材库.library　隐藏\n\n正式版本使用现有的目录隐藏与恢复功能。');return}if(a==='cache'){if(confirm('清理预览缓存？原始图片和项目会保留。\n此操作仅模拟，不清理真实文件。'))toast('模拟清理完成');return}const messages={addProvider:'预览：后续沿用现有新增供应商表单',save:'配置已保存 · 仅预览',refresh:'示例模型已刷新，未调用供应商',path:'预览：正式版本打开本地目录或文件选择器',scan:'模拟扫描完成',backup:'预览：导出项目与媒体备份',history:'预览：打开现有的聊天历史管理',logs:'预览：导出本地诊断信息'};toast(messages[a]||'交互预览')}
function syncTheme(){document.getElementById('themeTop').textContent=document.body.classList.contains('light')?'☾　深色预览':'☼　浅色预览'}document.getElementById('themeTop').onclick=()=>{document.body.classList.toggle('light');syncTheme()};render();
</script></body></html>

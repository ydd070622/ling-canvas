<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Canvas — Node System V22</title>
<style>
:root{
  --canvas:#f6f6f7; --grid:#dedfe2; --card:#fff; --ink:#15171a; --muted:#8c9199;
  --line:#c2c6cc; --border:#e3e5e8; --blue:#586bf2;
  --shadow:0 12px 34px rgba(22,25,31,.10); --shadow2:0 20px 60px rgba(22,25,31,.14);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas)}
button,textarea,input{font:inherit}
button{cursor:pointer}
#app{width:100%;height:100%;position:relative;overflow:hidden;background:#f6f6f7}

.topbar{
  position:absolute;top:16px;left:18px;right:18px;height:46px;z-index:100;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none;
}
.topbar>*{pointer-events:auto}
.brand,.top-actions{display:flex;align-items:center;gap:8px}
.brand-box,.top-btn{
  height:40px;border:1px solid var(--border);background:rgba(255,255,255,.92);backdrop-filter:blur(18px);
  border-radius:12px;box-shadow:0 5px 16px rgba(0,0,0,.04);display:flex;align-items:center;
}
.brand-box{padding:0 14px;gap:9px;font-size:13px;font-weight:700}
.logo{width:17px;height:17px;border-radius:5px;background:#141516;position:relative}
.logo:after{content:"";position:absolute;width:5px;height:5px;background:white;border-radius:2px;right:3px;bottom:3px}
.top-btn{border:1px solid var(--border);padding:0 12px;color:#626770;font-size:12px;gap:7px}
.top-btn:hover{background:#fff;color:#222}

#viewport{position:absolute;inset:0;overflow:hidden;cursor:default}
#world{
  position:absolute;left:0;top:0;width:6000px;height:4000px;transform-origin:0 0;
  background-image:radial-gradient(circle at 1px 1px,#d9dadd 1px,transparent 1.1px);
  background-size:22px 22px;
}
#edges{position:absolute;left:0;top:0;width:6000px;height:4000px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:#b8bdc4;stroke-width:1.8;vector-effect:non-scaling-stroke}
.edge.hot{stroke:#6f7783}
.edge-temp{fill:none;stroke:#7e8794;stroke-width:1.8;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.edge-arrow{fill:#b8bdc4}

.node{
  position:absolute;background:#fff;border:1px solid #e5e7ea;border-radius:14px;
  box-shadow:0 8px 26px rgba(25,28,33,.07);user-select:none;overflow:visible;
  transition:border-color .14s,box-shadow .14s,width .14s ease,height .14s ease;
}
.node:hover{box-shadow:0 12px 30px rgba(25,28,33,.09)}
.node.selected{border-color:#8fa0ff;box-shadow:0 0 0 3px rgba(88,107,242,.12),0 18px 44px rgba(25,28,33,.12)}
.node.generating{outline:1px solid rgba(88,107,242,.28)}
.node.marquee-hit{outline:2px solid rgba(88,107,242,.72);outline-offset:3px}

.node-toolbar{
  position:absolute;left:50%;top:-43px;transform:translateX(-50%);
  display:none;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:4px;box-shadow:0 8px 22px rgba(0,0,0,.10);z-index:20;white-space:nowrap;
}
.node.selected .node-toolbar{display:flex}
.toolbtn{height:27px;min-width:27px;border:0;border-radius:7px;background:transparent;color:#707681;font-size:11px;padding:0 8px}
.toolbtn:hover{background:#f1f2f4;color:#222}
.toolsep{width:1px;height:15px;background:#e7e8eb;margin:0 2px}

.io{
  position:absolute;top:50%;transform:translateY(-50%);z-index:25;
  width:24px;height:24px;border:0;border-radius:50%;background:#fff;color:#656c76;
  box-shadow:0 3px 12px rgba(0,0,0,.14);display:none;align-items:center;justify-content:center;
  font-size:18px;line-height:1;border:1px solid #e1e3e6;
}
.node.selected .io,.node:hover .io{display:flex}
.io.in{left:-13px;font-size:12px}
.io.out{right:-13px}
.io:hover{transform:translateY(-50%) scale(1.08);background:#17191c;color:white;border-color:#17191c}
.io.active{display:flex;background:#17191c;color:white}

.node-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 11px;cursor:grab}
.node-head:active{cursor:grabbing}
.kind{display:flex;align-items:center;gap:7px;font-size:11px;color:#666c75;font-weight:650}
.kinddot{width:7px;height:7px;border-radius:99px}
.mini-more{border:0;background:transparent;color:#a0a4aa;font-size:16px;line-height:1}

.text-node{width:280px}
.text-node .kinddot{background:#f0a14d}
.text-body{padding:0 10px 10px}
.text-body textarea{
  width:100%;height:132px;resize:none;border:0;outline:0;border-radius:9px;background:#f7f7f8;
  padding:11px 12px;font-size:13px;line-height:1.55;color:#2a2d32;
}
.meta{height:28px;border-top:1px solid #f0f1f2;padding:0 10px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#9a9ea5}

.media-node{width:310px;background:#fff;transition:width .16s ease,height .16s ease}
.media-node .node-head{height:33px}
.media-node.image .kinddot{background:#32b681}
.media-node.video .kinddot{background:#8a63df}
.media-node.audio .kinddot{background:#e86262}
.media-frame{margin:0 7px 7px;border-radius:10px;overflow:hidden;position:relative;background:#eceef1}
.image-frame{
  height:auto;
  aspect-ratio:3 / 2;
  min-height:120px;
  max-height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eceef1
}
.image-frame img{width:100%;height:100%;object-fit:contain;display:block}
.video-frame{height:174px;background:linear-gradient(145deg,#30333a,#16191d);display:flex;align-items:center;justify-content:center}
.video-frame video{width:100%;height:100%;object-fit:contain;display:block;background:#16191d}
.play{width:46px;height:46px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);color:#fff;border-radius:50%;display:grid;place-items:center;padding-left:3px}
.timecode{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:3px 6px;font-size:9px}
.media-footer{height:31px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;color:#898e96;font-size:10px}
.refpill{padding:3px 7px;background:#f1f2f4;border-radius:7px;color:#717780}

.audio-body{padding:5px 10px 10px}
.wave{height:72px;border-radius:10px;background:#f5f5f7;display:flex;align-items:center;gap:3px;padding:0 12px;overflow:hidden}
.wave i{display:block;width:3px;border-radius:4px;background:#9096a0}
.audio-controls{display:flex;align-items:center;gap:9px;padding-top:8px;font-size:10px;color:#8a8f97}

.task-node{width:318px}
.task-node .kinddot{background:#5e73f1}
.task-card{margin:0 8px 8px;background:#f7f8fb;border-radius:10px;padding:10px}
.task-prompt{font-size:12px;color:#343841;line-height:1.5;min-height:56px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:9px;padding:4px 7px;border-radius:6px;background:white;border:1px solid #e6e8ec;color:#747a84}
.runrow{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.run{border:0;background:#181a1d;color:#fff;border-radius:8px;height:28px;padding:0 10px;font-size:10px}
.status{font-size:9px;color:#92979f}

.placeholder-frame{
  height:180px;margin:0 7px 7px;border:1px dashed #d4d7dc;border-radius:10px;background:#fafafa;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a0a5ad;gap:8px;font-size:11px
}
.placeholder-icon{font-size:24px;color:#b5b9bf}
.image-uploadable,.media-uploadable{cursor:pointer}
.image-uploadable.dragover,.media-uploadable.dragover{outline:2px solid rgba(88,107,242,.55);outline-offset:-2px;background:#f4f6ff}
.upload-tip{font-size:9px;color:#a1a6ae;margin-top:2px}
.replace-btn{color:#5f6ff0!important}

.stack-node{width:275px;height:182px;background:transparent;border:0;box-shadow:none}
.stack-layer{position:absolute;inset:12px 8px 2px 12px;background:white;border:1px solid #e2e4e8;border-radius:13px;box-shadow:0 7px 22px rgba(20,23,27,.07)}
.stack-layer.l2{transform:translate(10px,-8px)}
.stack-layer.l3{transform:translate(20px,-16px)}
.stack-front{position:absolute;inset:0 20px 18px 0;background:white;border:1px solid #dfe2e6;border-radius:13px;box-shadow:0 12px 28px rgba(20,23,27,.10);padding:12px}
.stack-title{font-size:12px;font-weight:700;margin-bottom:8px}
.stack-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.stack-thumbs div{height:78px;border-radius:7px;background:linear-gradient(145deg,#ded7cf,#8d9197)}
.stack-count{position:absolute;right:7px;top:7px;background:#1c1e21;color:#fff;border-radius:8px;padding:4px 7px;font-size:9px}

.selection-toolbar{
  position:absolute;display:none;z-index:60;background:#fff;border:1px solid var(--border);box-shadow:0 10px 28px rgba(0,0,0,.12);
  border-radius:11px;padding:5px;align-items:center;gap:3px;
}
.selection-toolbar.show{display:flex}
.selection-toolbar button{height:29px;border:0;background:transparent;border-radius:7px;padding:0 9px;color:#656b74;font-size:11px}
.selection-toolbar button:hover{background:#f2f3f5;color:#222}
.selection-toolbar .primary{background:#17191c;color:#fff}
.selection-toolbar .primary:hover{background:#000;color:white}

.create-menu{
  position:absolute;z-index:150;width:238px;background:rgba(255,255,255,.98);border:1px solid #dde0e4;
  box-shadow:0 18px 50px rgba(18,22,28,.17);border-radius:15px;padding:8px;display:none;backdrop-filter:blur(18px)
}
.create-menu.show{display:block}
.menu-title{font-size:10px;color:#9a9fa7;padding:4px 7px 7px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.type-item{
  border:0;background:transparent;border-radius:10px;min-height:54px;padding:8px;display:flex;align-items:center;gap:8px;text-align:left;color:#34383e
}
.type-item:hover{background:#f2f3f5}
.type-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:#edeff2;font-size:13px}
.type-txt b{display:block;font-size:11px;margin-bottom:2px}.type-txt span{font-size:9px;color:#969ba3}
.menu-line{height:1px;background:#eceef0;margin:7px 2px}
.menu-option{width:100%;height:34px;border:0;background:transparent;border-radius:8px;text-align:left;padding:0 9px;color:#666d77;font-size:10px}
.menu-option:hover{background:#f3f4f6}
.branch-row{display:none;gap:5px;padding:0 0 7px}
.branch-row.show{display:flex}
.branch-btn{flex:1;height:30px;border:1px solid var(--border);background:#fafafa;border-radius:8px;color:#737983;font-size:10px}
.branch-btn.active{background:#17191c;color:#fff;border-color:#17191c}

.left-tools{
  position:absolute;left:18px;top:80px;z-index:80;width:44px;padding:5px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.06);
  display:flex;flex-direction:column;gap:3px
}
.left-tools button{height:34px;border:0;background:transparent;border-radius:8px;color:#686e78;font-size:14px}
.left-tools button:hover{background:#f1f2f4;color:#1f2226}

.zoom{
  position:absolute;left:18px;bottom:22px;z-index:80;height:38px;padding:4px;background:#fff;border:1px solid var(--border);
  border-radius:11px;box-shadow:0 8px 22px rgba(0,0,0,.07);display:flex;align-items:center;gap:2px
}
.zoom button{width:28px;height:28px;border:0;background:transparent;border-radius:7px;color:#6f747c}
.zoom button:hover{background:#f2f3f5}.zoom span{font-size:10px;color:#858a92;min-width:45px;text-align:center}

.composer-wrap{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:120;width:min(780px,calc(100vw - 180px))
}
.context-strip{display:flex;gap:6px;margin:0 10px 7px;min-height:0;flex-wrap:wrap}
.context-chip{
  height:28px;background:#fff;border:1px solid #e0e2e5;border-radius:9px;box-shadow:0 5px 14px rgba(0,0,0,.05);
  display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10px;color:#656b74
}
.context-chip .x{color:#aaa}
.composer{
  background:rgba(255,255,255,.97);backdrop-filter:blur(22px);border:1px solid #dfe2e6;border-radius:18px;
  box-shadow:0 18px 55px rgba(19,23,30,.16);padding:8px
}
.compose-main{display:flex;align-items:flex-end;gap:7px}
.compose-main textarea{
  flex:1;min-height:43px;max-height:120px;resize:none;border:0;outline:0;background:transparent;padding:10px 8px 8px;font-size:13px;line-height:1.45;color:#25282d
}
.attach,.send{width:40px;height:40px;border:0;border-radius:11px;display:grid;place-items:center}
.attach{background:#f1f2f4;color:#676d76;font-size:18px}.send{background:#17191c;color:#fff;font-size:16px}
.compose-options{padding:7px 2px 1px;display:flex;align-items:center;justify-content:space-between}
.opt-left{display:flex;gap:5px;flex-wrap:wrap}
.opt{
  height:27px;border:1px solid #e5e7ea;background:#fafafa;border-radius:8px;padding:0 8px;font-size:9px;color:#6f757e
}
.mode-switch{height:27px;display:flex;padding:2px;background:#f1f2f4;border-radius:8px}
.mode-switch button{border:0;background:transparent;border-radius:6px;padding:0 8px;font-size:9px;color:#7a7f87}
.mode-switch button.active{background:white;box-shadow:0 1px 4px rgba(0,0,0,.08);color:#26292e}
.node-type-pill{height:27px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid #e4e6e9;background:#f8f9fa;border-radius:8px;color:#555b64;font-size:9px;font-weight:650}
.node-type-dot{width:6px;height:6px;border-radius:50%;background:#32b681;flex:0 0 auto}
.node-type-select{height:25px;border:0;background:transparent;color:#555b64;font-size:9px;font-weight:650;outline:none;padding:0 15px 0 0}
.compose-option-select{height:27px;min-width:82px;border:1px solid #e5e7ea;background:#fafafa;border-radius:8px;padding:0 7px;color:#6f757e;font-size:9px;outline:none}
.compose-option-select:hover{background:#f3f4f6;color:#34383e}
.compose-option-select:focus{border-color:#a8b2f6;box-shadow:0 0 0 2px rgba(88,107,242,.08)}
.compose-option-select.ratio{min-width:68px}.compose-option-select.count{min-width:62px}
.compose-send-hint{margin-left:auto;color:#a0a4aa;font-size:9px;white-space:nowrap}
.prompt-references{display:none;gap:6px;align-items:center;flex-wrap:wrap;padding:3px 7px 7px}
.prompt-references.show{display:flex}
.prompt-ref{height:30px;border:1px solid #dfe2e6;border-radius:8px;background:#f7f8fa;display:flex;align-items:center;gap:6px;padding:3px 7px 3px 3px;color:#5e6570;font-size:10px}
.prompt-ref img,.prompt-ref-thumb{width:24px;height:24px;border-radius:6px;object-fit:cover;background:linear-gradient(145deg,#d9d4ce,#858b92);display:block}
.prompt-ref .remove{border:0;background:transparent;color:#9a9fa7;padding:0;font-size:13px}
.mention-menu{position:absolute;left:18px;right:18px;bottom:100%;margin-bottom:8px;display:none;max-height:230px;overflow:auto;background:#fff;border:1px solid #dfe2e6;border-radius:12px;box-shadow:0 14px 42px rgba(18,22,28,.16);padding:6px;z-index:4}
.mention-menu.show{display:block}
.mention-item{width:100%;height:48px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:9px;padding:5px;text-align:left;color:#454a52}
.mention-item:hover{background:#f1f3f6}
.mention-item img,.mention-item .mention-thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:linear-gradient(145deg,#d9d4ce,#858b92);flex:0 0 auto}
.mention-copy b{display:block;font-size:11px}.mention-copy span{display:block;font-size:9px;color:#969ca5;margin-top:2px}
.selection-box{position:absolute;z-index:70;display:none;border:1px solid rgba(88,107,242,.74);background:rgba(88,107,242,.08);pointer-events:none}
.selection-box.show{display:block}
.hint{position:absolute;top:84px;left:50%;transform:translateX(-50%);font-size:10px;color:#9ba0a7;z-index:30;pointer-events:none}
.toast{
  position:absolute;top:82px;left:50%;transform:translate(-50%,-6px);z-index:200;background:#17191c;color:#fff;
  border-radius:10px;padding:9px 12px;font-size:10px;opacity:0;pointer-events:none;transition:.18s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.media-viewer{
  position:absolute;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:48px;background:rgba(12,14,18,.88);backdrop-filter:blur(14px)
}
.media-viewer.show{display:flex}
.viewer-stage{position:relative;display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%}
.viewer-stage img,.viewer-stage video{
  display:block;max-width:calc(100vw - 96px);max-height:calc(100vh - 96px);width:auto;height:auto;
  object-fit:contain;border-radius:12px;box-shadow:0 22px 70px rgba(0,0,0,.34)
}
.viewer-fallback{
  width:min(1100px,calc(100vw - 96px));height:min(70vh,720px);overflow:hidden;border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:#25282d;box-shadow:0 22px 70px rgba(0,0,0,.34)
}
.viewer-fallback>*{width:100%!important;height:100%!important;margin:0!important;border-radius:0!important}
.viewer-fallback .play{width:64px!important;height:64px!important;border-radius:50%!important}
.viewer-close{
  position:absolute;right:22px;top:22px;width:40px;height:40px;border:1px solid rgba(255,255,255,.24);
  border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;display:grid;place-items:center
}
.viewer-close:hover{background:rgba(255,255,255,.22)}

/* ===== Focus / Compact node behavior ===== */
.node:not(.selected){
  background:transparent;
  border-color:transparent;
  box-shadow:none;
}
.node:not(.selected):hover{
  box-shadow:none;
  border-color:transparent;
}

.node:not(.selected) .node-head,
.node:not(.selected) .meta,
.node:not(.selected) .media-footer{
  display:none;
}

.node:not(.selected) .node-toolbar,
.node:not(.selected) .io{
  display:none !important;
}

/* Compact state: reveal only the outgoing + when hovering the node */
.node:not(.selected):hover .io.out,
.node:not(.selected):hover .io.in{
  display:flex !important;
}

/* Image nodes collapse to image only */
.media-node.image:not(.selected){
  padding:0;
  border-radius:12px;
  overflow:visible;
}
.media-node.image:not(.selected) .media-frame{
  margin:0;
  border-radius:12px;
  box-shadow:0 5px 18px rgba(20,24,30,.05);
}
.media-node.image:not(.selected) .placeholder-frame{
  margin:0;
}

/* Video nodes collapse to preview only */
.media-node.video:not(.selected) .media-frame{
  margin:0;
  border-radius:12px;
  box-shadow:0 5px 18px rgba(20,24,30,.05);
}
.media-node.video:not(.selected) video{pointer-events:none}

/* Audio nodes collapse to waveform only */
.media-node.audio:not(.selected) .audio-body{
  padding:0;
}
.media-node.audio:not(.selected) .wave,
.media-node.audio:not(.selected) .placeholder-frame{
  margin:0;
  border-radius:12px;
  box-shadow:0 5px 18px rgba(20,24,30,.05);
}

/* Text nodes collapse to plain text block */
.text-node:not(.selected){
  width:280px;
  border-radius:0;
}
.text-node:not(.selected) .text-body{
  padding:0;
}
.text-node:not(.selected) .text-body textarea{
  background:transparent;
  padding:2px 3px;
  border-radius:0;
  height:116px;
  pointer-events:none;
  overflow:hidden;
  color:#30343a;
}
.text-node:not(.selected):hover .text-body textarea{
  background:rgba(255,255,255,.38);
}

/* AI task nodes collapse to content block */
.task-node:not(.selected){
  background:transparent;
}
.task-node:not(.selected) .task-card{
  margin:0;
  background:rgba(255,255,255,.74);
  border:1px solid rgba(226,228,232,.65);
  box-shadow:0 4px 14px rgba(20,24,30,.035);
}
.task-node:not(.selected) .chips,
.task-node:not(.selected) .runrow{
  display:none;
}

/* Stack stays visual but loses chrome */
.stack-node:not(.selected){
  box-shadow:none;
}

/* Expanded/selected nodes restore full editing chrome */
.node.selected .node-head{
  display:flex;
}
.node.selected .meta,
.node.selected .media-footer{
  display:flex;
}
.node.selected.media-node.image .media-frame,
.node.selected.media-node.video .media-frame{
  margin:0 7px 7px;
}
.node.selected.media-node.audio .audio-body{
  padding:5px 10px 10px;
}
.node.selected.text-node .text-body{

<script>
const world = document.getElementById('world');
const viewport = document.getElementById('viewport');
const svg = document.getElementById('edges');
const menu = document.getElementById('createMenu');
const toast = document.getElementById('toast');
const contextStrip = document.getElementById('contextStrip');
const selectionToolbar = document.getElementById('selectionToolbar');
const selectionBox = document.getElementById('selectionBox');
const promptInputEl = document.getElementById('promptInput');
const promptReferences = document.getElementById('promptReferences');
const mentionMenu = document.getElementById('mentionMenu');
const bottomNodeType = document.getElementById('bottomNodeType');
const bottomNodeTypeDot = document.getElementById('bottomNodeTypeDot');
const bottomModel = document.getElementById('bottomModel');
const bottomRatio = document.getElementById('bottomRatio');
const bottomPreset = document.getElementById('bottomPreset');
const bottomCount = document.getElementById('bottomCount');

let scale=1, panX=-600, panY=-350, panning=false, panStart=null;
let dragging=null, linkDrag=null, selectionDrag=null, spaceDown=false, nodeSeq=20, selected=new Set();
let pendingSources=[], pendingWorldPos=null, pendingDirection='right', pendingBranch='up', pendingBranchEnabled=false, composeMode='image', editingNodeId=null, syncingComposer=false, groupSeq=0, selectedGroupId=null, groupDrag=null;
let composeCount=1;
const promptRefs=new Set();
let activeMention=null;
let connections=[
  {from:'n1',to:'n3'},{from:'n2',to:'n3'},{from:'n3',to:'n4'},{from:'n4',to:'n5'}
];

function wouldCreateCycle(from,to){
  if(from===to) return true;
  const stack=[to],seen=new Set();
  while(stack.length){
    const current=stack.pop();
    if(current===from) return true;
    if(seen.has(current)) continue;
    seen.add(current);
    connections.filter(c=>c.from===current).forEach(c=>stack.push(c.to));
  }
  return false;
}
function addConnection(from,to){
  if(!from||!to||from===to) return false;
  if(connections.some(c=>c.from===from&&c.to===to)) return false;
  if(wouldCreateCycle(from,to)){showToast('无法连接：这会形成循环工作流');return false}
  connections.push({from,to});
  return true;
}

function wp(cx,cy){
  const r=viewport.getBoundingClientRect();
  return {x:(cx-r.left-panX)/scale,y:(cy-r.top-panY)/scale};
}
function sp(wx,wy){
  const r=viewport.getBoundingClientRect();
  return {x:r.left+panX+wx*scale,y:r.top+panY+wy*scale};
}
function node(id){return document.querySelector(`.node[data-id="${id}"]`)}
function typeName(t){return ({text:'文本',image:'图片',video:'视频',audio:'音频',task:'AI任务',stack:'堆叠'})[t]||t}
function showToast(s){toast.textContent=s;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1500)}

function apply(){
  world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoomLabel').textContent=Math.round(scale*100)+'%';
  renderEdges(); updateFloatingUI();
}
function centerOf(el,side){
  return {x:el.offsetLeft+(side==='out'?el.offsetWidth:0), y:el.offsetTop+el.offsetHeight/2};
}
function path(a,b){
  const dx=Math.max(72,Math.abs(b.x-a.x)*.45);
  return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;
}
function renderEdges(temp=null){
  svg.innerHTML='';
  connections.forEach(c=>{
    const a=node(c.from),b=node(c.to); if(!a||!b)return;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',path(centerOf(a,'out'),centerOf(b,'in')));p.setAttribute('class','edge');svg.appendChild(p);
  });
  if(linkDrag&&temp){
    linkDrag.sources.forEach(id=>{
      const a=node(id);if(!a)return;
      const startSide=linkDrag.side==='left' ? 'in' : 'out';
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',path(centerOf(a,startSide),temp));
      p.setAttribute('class','edge-temp');
      svg.appendChild(p);
    })
  }
}
function setSelected(ids){
  if(ids.length) selectedGroupId=null;
  document.querySelectorAll('.canvas-group').forEach(g=>g.classList.remove('selected'));
  const nextSelected=new Set(ids);
  const nodes=[...document.querySelectorAll('.node')];

  // Record each node's current visual center before its compact/expanded state changes.
  const centers=new Map();
  nodes.forEach(n=>{
    const willChange = selected.has(n.dataset.id) !== nextSelected.has(n.dataset.id);
    if(!willChange) return;
    centers.set(n.dataset.id,{
      cx:n.offsetLeft + n.offsetWidth/2,
      cy:n.offsetTop + n.offsetHeight/2
    });
  });

  selected=nextSelected;

  // Toggle state first so the browser calculates the new compact/expanded dimensions.
  nodes.forEach(n=>{
    const isSelected=selected.has(n.dataset.id);
    n.classList.toggle('selected',isSelected);
    n.classList.toggle('multi-selected',isSelected && selected.size>1);
  });

  // Preserve the original visual center: expand/shrink equally in all directions.
  centers.forEach((c,id)=>{
    const n=node(id);
    if(!n) return;
    const newLeft=c.cx - n.offsetWidth/2;
    const newTop=c.cy - n.offsetHeight/2;
    n.style.left=newLeft+'px';
    n.style.top=newTop+'px';
  });

  renderEdges();
  updateContext();
  updateFloatingUI();
  syncComposerFromSelection();
  updateBottomNodeOptions();
}
function toggleSelect(id){

function referencePrefix(type){
  return ({text:'文本',image:'图片',video:'视频',audio:'音频',task:'任务',stack:'堆叠'})[type]||'节点';
}
function referenceLabelElement(el){
  return el.querySelector('.refpill')||el.querySelector('.meta span:last-child');
}
function assignUniqueReference(el,forceNew=false){
  const label=referenceLabelElement(el);
  if(!label)return '';
  const occupied=new Set([...document.querySelectorAll('.node')]
    .filter(other=>other!==el)
    .map(other=>other.dataset.refName||(referenceLabelElement(other)?.textContent||'').trim().replace(/^@/,''))
    .filter(Boolean));
  const current=el.dataset.refName||(label.textContent||'').trim().replace(/^@/,'');
  let name=!forceNew&&current&&!occupied.has(current)?current:'';
  if(!name){
    const prefix=referencePrefix(el.dataset.type);
    let index=1;
    while(occupied.has(prefix+index))index+=1;
    name=prefix+index;
  }
  el.dataset.refName=name;
  label.textContent='@'+name;
  return name;
}
function imageReferenceName(el){
  return el.dataset.refName||assignUniqueReference(el);
}
function imageReferenceNodes(){

function renderPromptReferences(){

function syncPromptRefsFromText(text){
  promptRefs.clear();
  const mentioned=new Set([...text.matchAll(/@([^\s@，。！？、,.;；：]+)/g)].map(match=>match[1]));
  imageReferenceNodes().forEach(el=>{
    if(mentioned.has(imageReferenceName(el))) promptRefs.add(el.dataset.id);

let mediaUploadTargetId=null;
const mediaPicker=document.getElementById('globalMediaPicker');


function adaptImageNodeToRatio(el,img){
  if(!el || !img || !img.naturalWidth || !img.naturalHeight) return;

  const ratio=img.naturalWidth/img.naturalHeight;

  let nodeWidth;
  if(ratio>=1.9) nodeWidth=390;          // panoramic
  else if(ratio>=1.45) nodeWidth=355;    // 16:9 / 3:2
  else if(ratio>=1.15) nodeWidth=330;    // mild landscape
  else if(ratio>=0.88) nodeWidth=292;    // square-ish
  else if(ratio>=0.68) nodeWidth=260;    // 3:4 / 2:3
  else nodeWidth=230;                    // tall portrait

  el.style.width=nodeWidth+'px';

  const frame=el.querySelector('.image-frame');
  if(frame){
    frame.style.aspectRatio=`${img.naturalWidth} / ${img.naturalHeight}`;
    frame.style.height='auto';
    frame.style.maxHeight='430px';
  }

  el.dataset.aspectRatio=ratio.toFixed(4);
  el.dataset.imageWidth=img.naturalWidth;
  el.dataset.imageHeight=img.naturalHeight;

  requestAnimationFrame(()=>{
    renderEdges();
    updateFloatingUI();
  });
}

function adaptVideoNodeToRatio(el,video){
  if(!el || !video || !video.videoWidth || !video.videoHeight) return;
  const ratio=video.videoWidth/video.videoHeight;
  let nodeWidth;
  if(ratio>=1.9) nodeWidth=400;
  else if(ratio>=1.45) nodeWidth=360;
  else if(ratio>=1.15) nodeWidth=330;
  else if(ratio>=.88) nodeWidth=292;
  else if(ratio>=.68) nodeWidth=260;
  else nodeWidth=230;
  el.style.width=nodeWidth+'px';
  const frame=el.querySelector('.video-frame');
  if(frame){
    frame.style.aspectRatio=`${video.videoWidth} / ${video.videoHeight}`;
    frame.style.height='auto';
    frame.style.maxHeight='430px';
  }
  el.dataset.aspectRatio=ratio.toFixed(4);
  requestAnimationFrame(()=>{renderEdges();updateFloatingUI()});
}

function adaptExistingImageNodes(root=document){
  root.querySelectorAll('.media-node.image img').forEach(img=>{
    const el=img.closest('.node');
    if(img.complete && img.naturalWidth){
      adaptImageNodeToRatio(el,img);
    }else{
      img.addEventListener('load',()=>adaptImageNodeToRatio(el,img),{once:true});
    }
  });
}

function ensureMediaUploadUI(el){
  if(!el || !['image','video'].includes(el.dataset.type)) return;
  const expectedType=el.dataset.type;
  const existingImg=el.querySelector('img');
  if(existingImg){
    if(existingImg.complete && existingImg.naturalWidth) adaptImageNodeToRatio(el,existingImg);
    else existingImg.addEventListener('load',()=>adaptImageNodeToRatio(el,existingImg),{once:true});
  }

  const existingVideo=el.querySelector('video');
  if(existingVideo){
    if(existingVideo.readyState>=1) adaptVideoNodeToRatio(el,existingVideo);
    else existingVideo.addEventListener('loadedmetadata',()=>adaptVideoNodeToRatio(el,existingVideo),{once:true});
  }

  const toolbar=el.querySelector('.node-toolbar');
  if(toolbar && !toolbar.querySelector('.replace-media')){
    const btn=document.createElement('button');
    btn.className='toolbtn replace-media replace-btn';
    btn.textContent=el.querySelector('img,video') ? '替换' : '上传';
    toolbar.insertBefore(btn, toolbar.firstChild);
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      mediaUploadTargetId=el.dataset.id;
      mediaPicker.accept=expectedType==='image' ? 'image/*' : 'video/*';
      mediaPicker.value='';
      mediaPicker.click();
    });
  }

  let area=el.querySelector('.placeholder-frame') || el.querySelector('.image-frame,.video-frame');
  if(area){
    area.classList.add('media-uploadable');
    if(!area.dataset.uploadBound){
      area.dataset.uploadBound='1';
      area.addEventListener('dragover',e=>{
        e.preventDefault();
        e.stopPropagation();
        area.classList.add('dragover');
      });
      area.addEventListener('dragleave',e=>{
        e.preventDefault();
        area.classList.remove('dragover');
      });
      area.addEventListener('drop',e=>{
        e.preventDefault();
        e.stopPropagation();
        area.classList.remove('dragover');
        const file=[...e.dataTransfer.files].find(f=>f.type.startsWith(expectedType+'/'));
        if(file) loadMediaIntoNode(el,file);
      });
    }
  }
}

function releaseObjectUrlIfUnused(url,except=null){
  if(!url || !url.startsWith('blob:')) return;
  const used=[...document.querySelectorAll('.node')].some(n=>n!==except&&n.dataset.objectUrl===url);
  if(!used) URL.revokeObjectURL(url);
}

function loadImageIntoNode(el,file){
  if(!el || !file) return;
  const previous=el.dataset.objectUrl;
  const url=URL.createObjectURL(file);
  el.dataset.objectUrl=url;

  let frame=el.querySelector('.image-frame');
  if(!frame){
    const placeholder=el.querySelector('.placeholder-frame');
    if(placeholder){
      frame=document.createElement('div');
      frame.className='media-frame image-frame image-uploadable';
      placeholder.replaceWith(frame);
    }
  }
  if(!frame) return;

  frame.innerHTML='';
  const img=document.createElement('img');
  img.src=url;
  img.alt=file.name;
  img.draggable=false;
  img.onload=()=>{
    const footerLeft=el.querySelector('.media-footer span:first-child');
    if(footerLeft) footerLeft.textContent=file.name;
    adaptImageNodeToRatio(el,img);
  };
  frame.appendChild(img);
  el.dataset.imageName=file.name;

  const btn=el.querySelector('.replace-media');
  if(btn) btn.textContent='替换';

  ensureMediaUploadUI(el);
  releaseObjectUrlIfUnused(previous,el);
  setSelected([el.dataset.id]);
  showToast('图片已载入节点');
}

function loadVideoIntoNode(el,file){
  if(!el || !file) return;
  const previous=el.dataset.objectUrl;
  const url=URL.createObjectURL(file);
  el.dataset.objectUrl=url;
  let frame=el.querySelector('.video-frame');
  if(!frame){
    const old=el.querySelector('.placeholder-frame,.media-frame');
    frame=document.createElement('div');
    frame.className='media-frame video-frame media-uploadable';
    if(old) old.replaceWith(frame);
  }
  if(!frame) return;
  frame.innerHTML='';
  const video=document.createElement('video');
  video.src=url;
  video.controls=true;
  video.muted=true;
  video.playsInline=true;
  video.preload='metadata';
  video.addEventListener('loadedmetadata',()=>{
    const footerLeft=el.querySelector('.media-footer span:first-child');
    if(footerLeft) footerLeft.textContent=file.name;
    adaptVideoNodeToRatio(el,video);
  },{once:true});
  frame.appendChild(video);
  el.dataset.videoName=file.name;
  const btn=el.querySelector('.replace-media');
  if(btn) btn.textContent='替换';
  ensureMediaUploadUI(el);
  releaseObjectUrlIfUnused(previous,el);
  setSelected([el.dataset.id]);
  showToast('视频已载入节点');
}

function loadMediaIntoNode(el,file){
  if(!el || !file) return;
  if(el.dataset.type==='image' && file.type.startsWith('image/')) loadImageIntoNode(el,file);
  else if(el.dataset.type==='video' && file.type.startsWith('video/')) loadVideoIntoNode(el,file);
  else showToast(el.dataset.type==='video' ? '请选择视频文件' : '请选择图片文件');
}

const mediaViewer=document.getElementById('mediaViewer');
const viewerStage=document.getElementById('viewerStage');

function closeMediaViewer(){

  mediaViewer.setAttribute('aria-hidden','true');

function openMediaViewer(el){
  if(!el || !['image','video'].includes(el.dataset.type)) return;
  const sourceImage=el.querySelector('.image-frame img');
  const sourceVideo=el.querySelector('.video-frame video');
  const frame=el.querySelector('.media-frame');
  viewerStage.innerHTML='';

  if(sourceImage){
    const image=document.createElement('img');
    image.src=sourceImage.currentSrc||sourceImage.src;
    image.alt=sourceImage.alt||'图片预览';
    viewerStage.appendChild(image);
  }else if(sourceVideo){
    const video=document.createElement('video');
    const resumeAt=sourceVideo.currentTime||0;
    video.src=sourceVideo.currentSrc||sourceVideo.src;
    video.controls=true;
    video.autoplay=true;
    video.playsInline=true;
    video.muted=sourceVideo.muted;
    video.addEventListener('loadedmetadata',()=>{
      if(resumeAt>0) video.currentTime=Math.min(resumeAt,Number.isFinite(video.duration)?video.duration:resumeAt);
    },{once:true});
    viewerStage.appendChild(video);
  }else if(frame){
    const fallback=document.createElement('div');
    fallback.className='viewer-fallback';
    fallback.style.background=getComputedStyle(frame).background;
    fallback.innerHTML=frame.innerHTML;
    viewerStage.appendChild(fallback);
  }else{
    showToast('当前节点还没有可查看的媒体');
    return;
  }

  mediaViewer.classList.add('show');
  mediaViewer.setAttribute('aria-hidden','false');
}

mediaPicker.addEventListener('change',()=>{

function groupMembers(g){

function updateGroupBounds(g){
  if(!g) return;
  const ids=groupMembers(g);
  const els=ids.map(node).filter(Boolean);
  if(!els.length){ g.remove(); return; }

  const pad=26;
  const minX=Math.min(...els.map(n=>n.offsetLeft));
  const minY=Math.min(...els.map(n=>n.offsetTop));
  const maxX=Math.max(...els.map(n=>n.offsetLeft+n.offsetWidth));
  const maxY=Math.max(...els.map(n=>n.offsetTop+n.offsetHeight));

  g.style.left=(minX-pad)+'px';
  g.style.top=(minY-pad)+'px';
  g.style.width=(maxX-minX+pad*2)+'px';
  g.style.height=(maxY-minY+pad*2)+'px';
}

function selectGroup(id){

  const centers=new Map();
  nodes.forEach(n=>{
    if(selected.has(n.dataset.id)){

function updateMarquee(clientX,clientY){
  if(!selectionDrag) return;
  const appRect=document.getElementById('app').getBoundingClientRect();
  const left=Math.min(selectionDrag.startX,clientX);
  const top=Math.min(selectionDrag.startY,clientY);
  const right=Math.max(selectionDrag.startX,clientX);
  const bottom=Math.max(selectionDrag.startY,clientY);
  selectionDrag.rect={left,top,right,bottom};
  selectionDrag.moved=Math.abs(clientX-selectionDrag.startX)+Math.abs(clientY-selectionDrag.startY)>5;
  selectionBox.style.left=(left-appRect.left)+'px';
  selectionBox.style.top=(top-appRect.top)+'px';
  selectionBox.style.width=(right-left)+'px';
  selectionBox.style.height=(bottom-top)+'px';
  selectionBox.classList.toggle('show',selectionDrag.moved);
  document.querySelectorAll('.node').forEach(el=>{
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    el.classList.toggle('marquee-hit',selectionDrag.moved&&cx>=left&&cx<=right&&cy>=top&&cy<=bottom);
  });
}
function finishMarquee(){
  if(!selectionDrag) return;
  const ids=selectionDrag.moved
    ? [...document.querySelectorAll('.node.marquee-hit')].map(el=>el.dataset.id)
    : [];
  document.querySelectorAll('.node.marquee-hit').forEach(el=>el.classList.remove('marquee-hit'));
  selectionBox.classList.remove('show');
  selectionDrag=null;
  setSelected(ids);
  if(ids.length>1) showToast(`已框选 ${ids.length} 个节点，可点击“打组”`);
}

  if(dragging){

    dragging.movers.forEach(m=>{
      m.n.style.left=(p.x-m.dx)+'px';
      m.n.style.top=(p.y-m.dy)+'px';

    groupDrag.members.forEach(m=>{
      m.n.style.left=(m.left+dx)+'px';
      m.n.style.top=(m.top+dy)+'px';

window.addEventListener('mouseup',e=>{
  if(selectionDrag) finishMarquee();
  panning=false;dragging=null;groupDrag=null;
  if(linkDrag){
    document.querySelectorAll('.io.active').forEach(x=>x.classList.remove('active'));
    const target=e.target.closest('.node');

    if(target && !linkDrag.sources.includes(target.dataset.id)){
      let connected=false;
      if(linkDrag.side==='left'){
        // Dragging from the left means the dropped node becomes upstream.
        linkDrag.sources.forEach(currentId=>{
          connected=addConnection(target.dataset.id,currentId)||connected;
        });
        if(connected) showToast('已连接上游节点');
      }else{
        // Dragging from the right means the dropped node becomes downstream.
        linkDrag.sources.forEach(currentId=>{
          connected=addConnection(currentId,target.dataset.id)||connected;
        });
        if(connected) showToast('已连接下游节点');
      }
      renderEdges();
    }else{
      const p=wp(e.clientX,e.clientY);
      openMenu(e.clientX,e.clientY,linkDrag.sources,p,linkDrag.side);
    }

    linkDrag=null;
    renderEdges();

function send(){
  const input=promptInputEl,txt=input.value.trim();

  if(editingNodeId && selected.size===1){
    const el=node(editingNodeId);
    if(el){
      setNodePrompt(el,txt);
      el.dataset.model=bottomModel.value;
      el.dataset.ratio=bottomRatio.value;
      el.dataset.count=bottomCount.value;
      promptRefs.forEach(refId=>{if(refId!==el.dataset.id)addConnection(refId,el.dataset.id)});
      renderEdges();
      showToast('节点提示词已更新');
    }

  }

  const c=wp(innerWidth/2,innerHeight/2), sources=[...new Set([...selected,...promptRefs])];
  const task=createNode('task',{x:c.x-170,y:c.y-270},sources,txt||`基于已选择的 ${sources.length} 个上游内容继续创作`);
  const outputs=[];
  for(let i=0;i<composeCount;i++){
    const column=i%2,row=Math.floor(i/2);
    const out=createNode(composeMode,{x:c.x+235+column*350,y:c.y-255+row*245},[task.dataset.id],'');
    out.dataset.model=bottomModel.value;
    out.dataset.ratio=bottomRatio.value;
    out.dataset.count=String(composeCount);
    outputs.push(out.dataset.id);

  setSelected(outputs);showToast(`已创建任务与 ${outputs.length} 个输出节点`);
}

document.getElementById('fitViewBtn').onclick=()=>{
  const nodes=[...document.querySelectorAll('.node')];
  if(!nodes.length){ scale=1;panX=-600;panY=-350;apply();return; }

  const minX=Math.min(...nodes.map(n=>n.offsetLeft));
  const minY=Math.min(...nodes.map(n=>n.offsetTop));
  const maxX=Math.max(...nodes.map(n=>n.offsetLeft+n.offsetWidth));
  const maxY=Math.max(...nodes.map(n=>n.offsetTop+n.offsetHeight));

  const contentW=Math.max(300,maxX-minX);
  const contentH=Math.max(220,maxY-minY);
  const marginX=220, marginY=180;
  const sx=(innerWidth-marginX)/contentW;
  const sy=(innerHeight-marginY)/contentH;
  scale=Math.max(.35,Math.min(1.2,Math.min(sx,sy)));

  const cx=(minX+maxX)/2;
  const cy=(minY+maxY)/2;
  panX=innerWidth/2-cx*scale;
  panY=innerHeight/2-cy*scale;
  apply();
};
document.getElementById('shortcutBtn').onclick=()=>showToast('拖拽空白框选 · Space 拖动画布 · Shift 多选 · Delete 删除');
document.getElementById('themeBtn').onclick=()=>{
  document.getElementById('app').classList.toggle('dark-canvas');
};

document.getElementById('zoomIn').onclick=()=>{scale=Math.min(1.8,scale*1.15);apply()};
document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.35,scale/1.15);apply()};
document.getElementById('homeView').onclick=()=>{scale=1;panX=-600;panY=-350;apply()};
document.getElementById('helpBtn').onclick=()=>showToast('节点右侧 +：点击选择类型；拖拽可连接或在落点创建新节点');

document.addEventListener('mousedown',e=>{
  if(!e.target.closest('.create-menu')&&!e.target.closest('.io.out'))closeMenu();

});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName)){spaceDown=true;e.preventDefault()}
  if((e.key==='Delete'||e.key==='Backspace')&&!['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName)&&selected.size)removeNodes([...selected]);
});
window.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});
apply();setSelected(['n2']);updateBottomNodeOptions();
</script>

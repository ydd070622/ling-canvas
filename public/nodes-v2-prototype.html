<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ling Canvas · 节点系统原型 v3</title>
<style>
/* ==========================================================================
   设计 token — 全部派生自产品既有颜色系统
   交互主色 ← 主页品牌蓝 (#4489f7 / .home-primary-btn)
   类型色   ← 设置面板 (.model-type-icon)
   状态色   ← 设置面板 (.connection-badge)
   材质语言 ← 主页卡片 (.home-project-card)：白底、极淡描边、大扩散阴影
   ========================================================================== */
:root {
  --page-bg:   #f7f9fc;
  --dot-color: #ccd6e4;

  --card-bg:     #ffffff;
  --card-border: rgba(30, 52, 82, .09);
  --hairline:    rgba(30, 52, 82, .07);
  --card-radius: 16px;
  --lift:      0 1px 2px rgba(16, 24, 40, .04), 0 14px 34px -14px rgba(16, 24, 40, .18);
  --lift-hover: 0 1px 2px rgba(16, 24, 40, .05), 0 22px 46px -16px rgba(16, 24, 40, .24);

  --t-strong: #273247;
  --t-mid:    #6b7a90;
  --t-weak:   #97a3b4;
  --t-faint:  #bcc6d4;

  --well:       rgba(30, 52, 82, .035);
  --well-hover: rgba(30, 52, 82, .055);

  --tone-text:  #6366f1;  --tone-text-soft:  #eef2ff;
  --tone-image: #10b981;  --tone-image-soft: #ecfdf5;
  --tone-video: #f97316;  --tone-video-soft: #fff7ed;
  --tone-group: #94a3b8;  --tone-group-soft: #f1f5f9;

  --accent:      #4489f7;
  --accent-deep: #397cf0;
  --accent-soft: rgba(68, 137, 247, .11);
  --accent-ring: rgba(59, 130, 246, .2);
  --accent-grad: linear-gradient(135deg, #4489f7, #397cf0);

  --ok: #10b981;   --ok-text: #059669;   --ok-soft: rgba(16, 185, 129, .11);
  --busy: #f59e0b; --busy-text: #b45309; --busy-soft: rgba(245, 158, 11, .13);
  --fail: #ef4444; --fail-text: #dc2626; --fail-soft: rgba(239, 68, 68, .1);

  --lbl-bg: rgba(255, 255, 255, .9);

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'SF Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace;
}

.dark {
  --page-bg:   #0a0a0b;
  --dot-color: #232326;

  --card-bg:     #1b1b1d;
  --card-border: rgba(255, 255, 255, .07);
  --hairline:    rgba(255, 255, 255, .06);
  --lift:       0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px -14px rgba(0, 0, 0, .7);
  --lift-hover: 0 1px 2px rgba(0, 0, 0, .5), 0 22px 46px -16px rgba(0, 0, 0, .8);

  --t-strong: #e9edf4;
  --t-mid:    #98a3b3;
  --t-weak:   #6e7887;
  --t-faint:  #4a5260;

  --well:       rgba(255, 255, 255, .045);
  --well-hover: rgba(255, 255, 255, .07);

  --tone-text-soft:  color-mix(in srgb, #6366f1 22%, #1b1b1d);
  --tone-image-soft: color-mix(in srgb, #10b981 22%, #1b1b1d);
  --tone-video-soft: color-mix(in srgb, #f97316 22%, #1b1b1d);
  --tone-group-soft: #232326;

  --ok: #34d399;  --ok-text: #4ade80;
  --busy-text: #fbbf24;

  --accent-soft: rgba(68, 137, 247, .18);
  --lbl-bg: rgba(24, 24, 26, .9);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font); background: var(--page-bg); color: var(--t-strong);
  -webkit-font-smoothing: antialiased;
  transition: background-color .24s ease, color .24s ease;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }

/* ==========================================================================
   顶栏
   ========================================================================== */
.topbar {
  position: fixed; z-index: 60; top: 0; left: 0; right: 0; height: 54px;
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: color-mix(in srgb, var(--card-bg) 82%, transparent);
  backdrop-filter: blur(16px) saturate(1.4);
  border-bottom: 1px solid var(--card-border);
}
.topbar__brand { display: flex; align-items: center; gap: 9px; }
.topbar__mark {
  width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px;
  background: var(--accent-grad); color: #fff; font-size: 13px; font-weight: 750;
  box-shadow: 0 4px 10px var(--accent-ring);
}
.topbar__brand b { display: block; font-size: 12.5px; font-weight: 680; letter-spacing: -.01em; }
.topbar__brand small { display: block; color: var(--t-weak); font-size: 10px; margin-top: 1px; }
.topbar__sep { width: 1px; height: 20px; background: var(--card-border); }
.topbar__group { display: flex; align-items: center; gap: 4px; }
.topbar__spacer { flex: 1; }

.tb {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border-radius: 9px; color: var(--t-mid); font-size: 12px; font-weight: 550;
  border: 1px solid transparent; transition: all .14s ease; white-space: nowrap;
}
.tb:hover { background: var(--well-hover); color: var(--t-strong); }
.tb--primary { background: var(--accent-grad); color: #fff; box-shadow: 0 4px 12px var(--accent-ring); }
.tb--primary:hover { filter: brightness(1.06); color: #fff; }
.tb--icon { width: 30px; justify-content: center; padding: 0; }
.tb svg { width: 14px; height: 14px; }
.tb__sq { width: 8px; height: 8px; border-radius: 2.5px; }

/* ==========================================================================
   画布
   ========================================================================== */
.viewport {
  position: fixed; inset: 54px 0 0 0; overflow: hidden;
  background-color: var(--page-bg);
  background-image: radial-gradient(circle, var(--dot-color) 1.1px, transparent 1.1px);
  background-size: 22px 22px;
}
.viewport.panning { cursor: grabbing; }
.viewport.space-ready { cursor: grab; }
.viewport.linking { cursor: crosshair; }
.world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

.edge-layer { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
.edge-layer path { fill: none; }
.edge-hit { stroke: transparent; stroke-width: 20; pointer-events: stroke; cursor: pointer; }
.edge-line { stroke-width: 1.75; transition: stroke-width .16s ease, opacity .16s ease; }
.edge-group:hover .edge-line { stroke-width: 2.6; }
.edge-group.dim { opacity: .28; }

.edge-tag {
  position: absolute; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: 7px;
  background: var(--lbl-bg); border: 1px solid var(--card-border);
  box-shadow: 0 2px 8px -2px rgba(16, 24, 40, .22);
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  color: var(--t-mid); pointer-events: none; white-space: nowrap;
  backdrop-filter: blur(6px);
}
.edge-tag b { font-weight: 700; }
.edge-tag--idle { opacity: .5; border-style: dashed; }
.edge-tag__role { font-family: var(--font); font-size: 9.5px; font-weight: 600; opacity: .62; }
.link-preview { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; opacity: .85; }
.link-preview.reject { stroke: var(--fail); }

/* ==========================================================================
   节点卡片
   ========================================================================== */
.node {
  position: absolute; width: 392px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--card-radius);
  box-shadow: var(--lift);
  transition: box-shadow .2s ease, border-color .2s ease, opacity .2s ease;
  user-select: none;
}
.node:hover { box-shadow: var(--lift-hover); }
.node.is-selected { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring), var(--lift-hover); }
.node.is-dragging { transition: none; }
.node.is-running { border-color: var(--busy); }
.node.is-failed  { border-color: var(--fail); }
.node.is-stale   { border-style: dashed; border-color: var(--busy); }

.node--group {
  background: color-mix(in srgb, var(--tone-group) 6%, transparent);
  border: 1.5px dashed color-mix(in srgb, var(--tone-group) 55%, transparent);
  box-shadow: none; border-radius: 18px;
}

/* 头部：无下边框，与卡片同面 */
.card-head { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; cursor: grab; }
.node.is-dragging .card-head { cursor: grabbing; }
.card-head__dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.node--text  .card-head__dot { background: var(--tone-text); }
.node--image .card-head__dot { background: var(--tone-image); }
.node--video .card-head__dot { background: var(--tone-video); }
.card-head__title {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12.5px; font-weight: 650; letter-spacing: -.012em;
}
.card-head__title[contenteditable="true"] { outline: none; cursor: text; user-select: text; box-shadow: 0 0 0 3px var(--accent-ring); border-radius: 5px; }

.status { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; font-size: 10.5px; font-weight: 600; color: var(--t-weak); }
.status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status--ok   { color: var(--ok-text); }
.status--busy { color: var(--busy-text); }
.status--fail { color: var(--fail-text); }
.status--busy i { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

/* 舞台：媒体 / 文本内容 */
.card-body { padding: 0 12px; }
.stage { position: relative; border-radius: 12px; overflow: hidden; background: var(--well); }
.media { position: relative; width: 100%; aspect-ratio: 4 / 3; display: grid; place-items: center; gap: 7px; }
.media--wide { aspect-ratio: 16 / 9; }
.media--empty { color: var(--t-faint); font-size: 11px; text-align: center; }
.media--empty svg { width: 26px; height: 26px; opacity: .55; margin: 0 auto; }
.media__fill { display: block; width: 100%; height: 100%; animation: fadein .3s ease; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.media__overlay { position: absolute; inset: 0; display: grid; place-items: center; gap: 8px; background: color-mix(in srgb, var(--card-bg) 74%, transparent); backdrop-filter: blur(3px); }
.media__meta {
  position: absolute; left: 10px; bottom: 10px; padding: 3px 7px; border-radius: 6px;
  background: rgba(12, 16, 24, .55); color: #fff; font-family: var(--mono); font-size: 9.5px;
  backdrop-filter: blur(6px);
}
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--card-border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 富文本字段：提示词与文本内容共用 */
.pfield {
  padding: 12px 14px; min-height: 92px; max-height: 300px; overflow-y: auto;
  outline: none; white-space: pre-wrap; word-break: break-word; user-select: text;
  font-size: 12.5px; line-height: 1.72; color: var(--t-strong); cursor: text;
}
.pfield--well {
  margin: 0 12px; min-height: 64px; border-radius: 12px; background: var(--well);
  transition: background-color .16s ease, box-shadow .16s ease;
}
.pfield--well:hover { background: var(--well-hover); }
.pfield--well:focus { background: var(--card-bg); box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 4.5px var(--accent-ring); }
.pfield:empty::before { content: attr(data-placeholder); color: var(--t-faint); pointer-events: none; }

/* 提示词里的引用芯片 —— 引用直接长在正文里，不再另开列表 */
.tok {
  display: inline-flex; align-items: center; padding: 1px 5px; margin: 0 1px;
  border-radius: 5px; font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  white-space: nowrap; cursor: default;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 24%, transparent);
}
.tok--text  { background: var(--tone-text-soft);  color: var(--tone-text); }
.tok--image { background: var(--tone-image-soft); color: var(--tone-image); }
.tok--video { background: var(--tone-video-soft); color: var(--tone-video); }
.tok--orphan { background: var(--well-hover); color: var(--t-weak); text-decoration: line-through; box-shadow: inset 0 0 0 1px var(--t-faint); }
.tok--beyond { background: var(--fail-soft); color: var(--fail-text); box-shadow: inset 0 0 0 1px var(--fail); }

/* 元信息条：无边框文字 chip */
.card-meta { display: flex; align-items: center; gap: 1px; flex-wrap: wrap; padding: 10px 8px 0; }
.mchip {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px;
  border-radius: 7px; color: var(--t-mid); font-size: 11px; font-weight: 550;
  transition: background-color .13s ease, color .13s ease; white-space: nowrap;
}
.mchip:hover { background: var(--well-hover); color: var(--t-strong); }
.mchip--mode { color: var(--accent); font-weight: 650; }
.mchip--mode:hover { background: var(--accent-soft); color: var(--accent); }
.mchip__chev { width: 9px; height: 9px; opacity: .5; }
.mchip__dot { width: 6px; height: 6px; border-radius: 50%; }

/* 底部动作条：与卡片同面，靠间距分隔而非分隔线 */
.card-actions { display: flex; align-items: center; gap: 8px; padding: 10px 14px 14px; }
.card-actions__note { flex: 1; min-width: 0; color: var(--t-weak); font-size: 10.5px; }
.card-actions__note b { color: var(--accent); font-weight: 650; }
.send {
  flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent-grad); color: #fff;
  box-shadow: 0 6px 14px -4px var(--accent-ring);
  transition: transform .15s ease, filter .15s ease;
}
.send:hover { transform: scale(1.07); filter: brightness(1.07); }
.send:active { transform: scale(.94); }
.send.is-stop { background: linear-gradient(135deg, #fb7185, #ef4444); box-shadow: 0 6px 14px -4px var(--fail-soft); }
.send svg { width: 14px; height: 14px; }
.send--text { width: auto; padding: 0 13px; border-radius: 9px; height: 30px; font-size: 11.5px; font-weight: 650; }

/* 提示条：细。左侧色条，不做整块填充 */
.notice {
  display: flex; align-items: center; gap: 8px;
  margin: 2px 12px 4px; padding: 7px 9px 7px 8px;
  border-radius: 9px; font-size: 11px; line-height: 1.5;
  background: var(--well); box-shadow: inset 2.5px 0 0 currentColor;
}
.notice__text { flex: 1; min-width: 0; }
.notice--stale { color: var(--busy-text); }
.notice--error { color: var(--fail-text); }
.notice--warn  { color: var(--busy-text); }
.notice button {
  flex: 0 0 auto; height: 21px; padding: 0 8px; border-radius: 6px;
  font-size: 10.5px; font-weight: 650; color: inherit;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 42%, transparent);
}
.notice button:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.notice button.ghost { box-shadow: none; opacity: .65; }

/* 端口：单一左入 / 单一右出，折叠后常驻 */
.port {
  position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px;
  border-radius: 50%; background: var(--card-bg); border: 2px solid var(--t-faint);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  cursor: crosshair; z-index: 4;
}
.port--in  { left: -7px; }
.port--out { right: -7px; }
.node--text  .port { border-color: var(--tone-text); }
.node--image .port { border-color: var(--tone-image); }
.node--video .port { border-color: var(--tone-video); }
.port:hover { transform: scale(1.5); box-shadow: 0 0 0 5px var(--accent-soft); }
.port.is-armed { background: var(--accent); border-color: var(--accent) !important; box-shadow: 0 0 0 6px var(--accent-ring); transform: scale(1.35); }
.port.is-hot   { border-color: var(--accent) !important; box-shadow: 0 0 0 6px var(--accent-ring); transform: scale(1.45); }
.port.is-no    { border-color: var(--fail) !important; box-shadow: 0 0 0 6px var(--fail-soft); }
.port__count {
  position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
  display: none; place-items: center;
  background: var(--accent); color: #fff; font-family: var(--mono); font-size: 9px; font-weight: 700;
  box-shadow: 0 0 0 2px var(--card-bg); cursor: pointer; pointer-events: auto;
}
.node.has-inbound .port__count { display: grid; }
.port__count:hover { filter: brightness(1.1); }

/* 折叠态：头部 + 一条内容带，端口常驻 */
.node.is-collapsed { width: 234px; }
.node.is-collapsed .card-body,
.node.is-collapsed .card-meta,
.node.is-collapsed .pfield--well,
.node.is-collapsed .card-actions,
.node.is-collapsed .notice { display: none; }
.peek { display: none; margin: 0 8px 8px; border-radius: 9px; overflow: hidden; background: var(--well); }
.node.is-collapsed .peek { display: block; }
.peek__strip { height: 46px; display: grid; place-items: center; }
.peek__strip .media__fill { height: 46px; }
.peek__line {
  display: block; padding: 8px 11px; overflow: hidden;
  font-size: 11px; line-height: 1.5; color: var(--t-mid);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal;
}
.peek__none { padding: 10px 11px; color: var(--t-faint); font-size: 10.5px; }

/* 药丸工具栏 */
.toolbar {
  position: absolute; left: 50%; bottom: 100%; margin-bottom: 9px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  box-shadow: 0 10px 26px -8px rgba(16, 24, 40, .28);
  opacity: 0; pointer-events: none; transition: opacity .16s ease; z-index: 5;
}
.node:hover .toolbar, .node.is-selected .toolbar { opacity: 1; pointer-events: auto; }
.toolbar__sep { width: 1px; height: 14px; background: var(--card-border); margin: 0 3px; }
.tbtn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: var(--t-mid); transition: all .13s ease; }
.tbtn:hover { background: var(--well-hover); color: var(--t-strong); }
.tbtn--danger:hover { background: var(--fail-soft); color: var(--fail); }
.tbtn svg { width: 14px; height: 14px; }

/* 分组 */
.group-title {
  position: absolute; top: -26px; left: 3px; padding: 4px 9px; border-radius: 8px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  color: var(--t-strong); font-size: 11.5px; font-weight: 650; white-space: nowrap; cursor: grab;
  box-shadow: 0 2px 8px -3px rgba(16, 24, 40, .2);
}
.group-title[contenteditable="true"] { outline: none; cursor: text; user-select: text; box-shadow: 0 0 0 3px var(--accent-ring); }

/* ==========================================================================
   浮层
   ========================================================================== */
.menu {
  position: fixed; z-index: 90; min-width: 200px; padding: 5px;
  border-radius: 13px; border: 1px solid var(--card-border);
  background: var(--card-bg); box-shadow: 0 20px 46px -14px rgba(16, 24, 40, .32);
  animation: pop .13s ease;
}
.dark .menu { box-shadow: 0 20px 46px -14px rgba(0, 0, 0, .75); }
@keyframes pop { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
.menu__title { padding: 6px 9px 7px; color: var(--t-weak); font-size: 10.5px; font-weight: 650; }
.menu__item { display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; text-align: left; color: var(--t-strong); font-size: 12.5px; }
.menu__item:hover, .menu__item.is-active { background: var(--accent-soft); color: var(--accent); }
.menu__item small { margin-left: auto; color: var(--t-weak); font-size: 10px; font-weight: 500; }
.menu__item i { width: 21px; height: 21px; display: grid; place-items: center; border-radius: 6px; font-style: normal; font-family: var(--mono); font-size: 10px; font-weight: 700; color: #fff; flex: 0 0 auto; }
.menu__item.is-disabled { opacity: .4; pointer-events: none; }
.menu__empty { padding: 14px 12px; color: var(--t-weak); font-size: 11px; text-align: center; }
.menu__hint { padding: 6px 9px 5px; margin-top: 3px; border-top: 1px solid var(--hairline); color: var(--t-faint); font-size: 10px; }
.mention { position: fixed; z-index: 95; width: 254px; max-height: 236px; overflow-y: auto; }

/* 引用顺序浮层：点输入端口才出现，平时不占版面 */
.refpop { position: fixed; z-index: 96; width: 258px; padding: 6px; }
.refpop__row {
  display: flex; align-items: center; gap: 8px; padding: 6px 7px; border-radius: 8px;
  font-size: 11.5px; transition: background-color .13s ease;
}
.refpop__row:hover { background: var(--well-hover); }
.refpop__row.is-over { background: var(--accent-soft); box-shadow: inset 0 2px 0 var(--accent); }
.refpop__row.is-dragging { opacity: .4; }
.refpop__grip { width: 12px; color: var(--t-faint); cursor: grab; }
.refpop__grip svg { width: 11px; height: 11px; }
.refpop__code {
  min-width: 24px; height: 18px; padding: 0 5px; display: grid; place-items: center;
  border-radius: 5px; font-family: var(--mono); font-size: 10px; font-weight: 700; color: #fff;
}
.refpop__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t-strong); }
.refpop__role { color: var(--t-weak); font-size: 10.5px; }
.refpop__x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; color: var(--t-faint); }
.refpop__x:hover { background: var(--fail-soft); color: var(--fail); }
.refpop__x svg { width: 10px; height: 10px; }
.refpop__idle { opacity: .5; }
.refpop__idle .refpop__code { background: var(--t-faint); }

/* 日志 / toast / 提示条 */
.logpanel {
  position: fixed; right: 12px; bottom: 12px; z-index: 70; width: 344px; max-height: 246px;
  display: flex; flex-direction: column; border-radius: 13px; border: 1px solid var(--card-border);
  background: color-mix(in srgb, var(--card-bg) 92%, transparent); backdrop-filter: blur(14px);
  box-shadow: 0 16px 40px -16px rgba(16, 24, 40, .28); overflow: hidden;
}
.logpanel.is-collapsed { max-height: 36px; }
.logpanel__head { display: flex; align-items: center; gap: 7px; padding: 9px 11px; cursor: pointer; flex: 0 0 auto; }
.logpanel__head b { font-size: 11px; font-weight: 650; }
.logpanel__head small { color: var(--t-weak); font-size: 10px; }
.logpanel__head .tbtn { margin-left: auto; width: 22px; height: 22px; }
.logpanel__body { overflow-y: auto; padding: 2px 9px 10px; font-size: 10.5px; line-height: 1.55; }

.logline { display: flex; gap: 7px; padding: 3px 5px; border-radius: 5px; font-family: var(--mono); }
.logline time { color: var(--t-faint); flex: 0 0 auto; }
.logline span { flex: 1; min-width: 0; word-break: break-word; }
.logline--ok span   { color: var(--ok-text); }
.logline--warn span { color: var(--busy-text); }
.logline--err span  { color: var(--fail-text); }
.logline--info span { color: var(--t-mid); }

.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none; }
.toast {
  padding: 9px 15px; border-radius: 11px; font-size: 12px; font-weight: 550;
  background: var(--card-bg); border: 1px solid var(--card-border);
  box-shadow: 0 16px 40px -16px rgba(16, 24, 40, .3);
  animation: toastin .2s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes toastin { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.toast--ok   { color: var(--ok-text); }
.toast--warn { color: var(--busy-text); }

.hintbar {
  position: fixed; left: 12px; bottom: 12px; z-index: 65;
  display: flex; align-items: center; gap: 13px; flex-wrap: wrap; max-width: min(640px, 50vw);

  box-shadow: 0 14px 36px -16px rgba(16, 24, 40, .24); color: var(--t-weak); font-size: 10.5px;
}
.hintbar b { color: var(--t-mid); font-weight: 650; }

}

</style>

    </button>

<div class="toasts" id="toasts"></div>

<script>
/* ==========================================================================
   A · 数据层：模式矩阵、引用编号、校验、stale 传播、撤销、几何
   ========================================================================== */

const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);

const MODES = {
  text: {
    gen:    { label: '文生文',   accept: { text: 3 } },
    vision: { label: '图文理解', accept: { text: 3, image: 4, video: 1 } }
  },
  image: {
    t2i:  { label: '文生图',   accept: { text: 3 }, roles: { text: ['提示词', '补充', '补充'] } },
    i2i:  { label: '图生图',   accept: { image: 2, text: 2 }, roles: { image: ['底图', '参考'], text: ['描述', '补充'] } },
    ref:  { label: '参考重绘', accept: { image: 4, text: 2 }, roles: { image: ['参考', '参考', '参考', '参考'], text: ['描述', '补充'] } },
    edit: { label: '局部编辑', accept: { image: 1, text: 1 }, roles: { image: ['底图'], text: ['编辑要求'] } },
    grid: { label: '九宫格分镜', accept: { text: 2 }, roles: { text: ['分镜要求', '补充'] } }
  },
  video: {
    t2v:   { label: '文生视频', accept: { text: 3 }, roles: { text: ['描述', '补充', '补充'] } },
    i2v:   { label: '图生视频', accept: { image: 1, text: 2 }, roles: { image: ['首帧'], text: ['运动描述', '补充'] } },
    flf:   { label: '首尾帧',   accept: { image: 2, text: 2 }, roles: { image: ['首帧', '尾帧'], text: ['运动描述', '补充'] } },
    ref:   { label: '图片参考', accept: { image: 4, text: 2 }, roles: { image: ['参考', '参考', '参考', '参考'], text: ['描述', '补充'] } },
    vref:  { label: '视频参考', accept: { video: 2, image: 2, text: 2 }, roles: { video: ['参考视频', '参考视频'], image: ['参考', '参考'], text: ['描述', '补充'] } },
    vedit: { label: '视频编辑', accept: { video: 1, text: 1 }, roles: { video: ['待编辑'], text: ['编辑要求'] } }
  }
};

const KIND_CODE  = { text: 'T', image: 'I', video: 'V' };
const KIND_TITLE = { text: 'Text', image: 'Image', video: 'Video' };
const TYPE_LABEL = { text: '文本', image: '图片', video: '视频', group: '节点组' };

const MODELS = {
  text:  [{ k: 'gpt-4o-mini', l: 'GPT-4o mini' }, { k: 'claude-sonnet-5', l: 'Claude Sonnet 5' }, { k: 'deepseek-v3', l: 'DeepSeek V3' }],
  image: [{ k: 'nano-banana', l: 'Nano Banana' }, { k: 'seedream-4', l: 'Seedream 4.0' }, { k: 'flux-1.1-pro', l: 'FLUX 1.1 Pro' }],
  video: [{ k: 'seedance-1', l: 'Seedance 1.0' }, { k: 'kling-2.1', l: '可灵 2.1' }, { k: 'veo-3', l: 'Veo 3' }]
};
const ASPECTS = ['1:1', '4:3', '3:4', '16:9', '9:16'];
const RESOLUTIONS = ['720p', '1080p'];
const DURATIONS = [5, 10];

const S = {
  nodes: [], edges: [], view: { x: 260, y: 180, k: 1 }, sel: new Set(), dark: false,
  titleSeq: { text: 0, image: 0, video: 0, group: 0 },
  undo: [], redo: [],
  linking: null, measure: {}
};

const nodeById = (id) => S.nodes.find(n => n.id === id);
const edgeById = (id) => S.edges.find(e => e.id === id);
const outEdges = (id) => S.edges.filter(e => e.source === id);
const inEdges  = (id) => S.edges.filter(e => e.target === id).sort((a, b) => a.order - b.order);

function modeOf(node) {
  if (node.type === 'text')  return MODES.text[node.textMode]  || MODES.text.gen;
  if (node.type === 'image') return MODES.image[node.mode]     || MODES.image.t2i;
  if (node.type === 'video') return MODES.video[node.mode]     || MODES.video.t2v;
  return { label: '容器', accept: {}, roles: {} };
}
function modeKeyOf(node) {
  if (node.type === 'text')  return node.textMode;
  if (node.type === 'image') return node.mode;
  if (node.type === 'video') return node.mode;
  return null;
}

/* 入边 → 槽位：按 order 升序，超出容量的标闲置，每类独立编号 */
function computeSlots(node) {
  const def = modeOf(node);
  const used = {}, slots = [], idle = [];
  inEdges(node.id).forEach((edge) => {
    const src = nodeById(edge.source);
    if (!src || src.type === 'group') return;
    const kind = src.type;
    const max = def.accept[kind] || 0;
    const n = used[kind] || 0;
    if (max === 0 || n >= max) { idle.push({ edge, src, kind, label: KIND_CODE[kind] }); return; }
    used[kind] = n + 1;
    const role = def.roles?.[kind]?.[n] || '上下文';
    slots.push({ edge, src, kind, index: n + 1, code: KIND_CODE[kind] + (n + 1), role, name: `{{${KIND_TITLE[kind]} ${n + 1}}}` });
  });
  return { slots, idle, def };
}

const TOKEN_RE = /\{\{\s*(Image|Video|Text)\s+(\d+)\s*\}\}/g;
const KIND_BY_TITLE = { Image: 'image', Video: 'video', Text: 'text' };

function parseTokens(text) {
  const out = []; let m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(text || ''))) {
    out.push({ raw: m[0], key: `${m[1]} ${m[2]}`, kind: KIND_BY_TITLE[m[1]], index: Number(m[2]), from: m.index, to: m.index + m[0].length });
  }
  return out;
}

/** 解析每个 token：ok / orphan（绑定边没了）/ beyond（编号越界） */
function resolveRefs(node) {
  const { slots } = computeSlots(node);
  const byKind = {};
  slots.forEach(s => { (byKind[s.kind] ||= []).push(s); });
  return parseTokens(node.prompt).map((t) => {
    const binding = node.refBindings?.[t.key];
    if (binding) {
      const hit = slots.find(s => s.edge.id === binding);
      return hit ? { ...t, status: 'ok', slot: hit } : { ...t, status: 'orphan' };
    }
    const nth = byKind[t.kind]?.[t.index - 1];
    return nth ? { ...t, status: 'ok', slot: nth } : { ...t, status: 'beyond' };
  });
}

function checkConnection(sourceId, targetId) {
  if (sourceId === targetId) return { ok: false, reason: '不能连接到自身。', code: 'R_SELF' };
  const src = nodeById(sourceId), tgt = nodeById(targetId);
  if (!src || !tgt) return { ok: false, reason: '节点不存在。', code: 'R_MISS' };
  if (tgt.type === 'group' || src.type === 'group') return { ok: false, reason: '节点组不能参与连线。', code: 'R_GROUP' };
  if (S.edges.some(e => e.source === sourceId && e.target === targetId)) return { ok: false, reason: '这条连线已经存在。', code: 'R_DUP' };
  const def = modeOf(tgt);
  const max = def.accept[src.type] || 0;
  if (max === 0) {
    if (src.type === 'image' || src.type === 'video') {
      return { ok: false, reason: `${TYPE_LABEL[src.type]}节点不能作为该模式的输入。切换目标节点的生成模式，或改连文本节点。`, code: 'R_KIND' };
    }
    return { ok: false, reason: `「${def.label}」模式不接受${TYPE_LABEL[src.type]}上游。`, code: 'R_KIND' };
  }
  const cur = inEdges(targetId).filter(e => nodeById(e.source)?.type === src.type).length;
  if (cur >= max) return { ok: false, reason: `「${def.label}」模式最多接收 ${max} 个${TYPE_LABEL[src.type]}上游，已达上限。`, code: 'R_MAX' };
  if (createsCycle(sourceId, targetId)) return { ok: false, reason: '该连接会形成循环引用。', code: 'R_CYCLE' };
  return { ok: true };
}

function createsCycle(sourceId, targetId) {
  const stack = [targetId], seen = new Set();
  while (stack.length) {
    const cur = stack.pop();
    if (cur === sourceId) return true;
    if (seen.has(cur)) continue;
    seen.add(cur);
    outEdges(cur).forEach(e => stack.push(e.target));
  }
  return false;
}

function checkGenerate(node) {
  const { slots } = computeSlots(node);
  const refs = resolveRefs(node);
  const prompt = (node.prompt || '').trim();
  for (const r of refs) {
    if (r.status === 'orphan') return { ok: false, code: 'E_ORPHAN', message: `提示词中的 ${r.raw} 已失效：来源连线已被删除。请重新连接上游，或点击「移除引用」。`, refs };
  }
  for (const r of refs) {
    if (r.status === 'beyond') {
      const count = slots.filter(s => s.kind === r.kind).length;
      return { ok: false, code: 'E_BEYOND', message: `引用了不存在的 ${r.raw}：当前仅连入 ${count} 个${TYPE_LABEL[r.kind]}。`, refs };
    }
  }
  if (!prompt && !refs.length) return { ok: false, code: 'E_EMPTY', message: '请输入提示词，或连入上游并在提示词中引用。', refs };
  const used = new Set(refs.map(r => r.slot?.edge.id).filter(Boolean));
  const unused = slots.filter(s => !used.has(s.edge.id));
  if (unused.length) {
    return {
      ok: true, warn: 'W_UNREF', refs, slots,
      message: `连入了 ${unused.length} 个上游但没引用，本次生成不会用到它们。`,
      actions: [{ label: '插入引用', act: 'insert-refs' }, { label: '仍然生成', act: 'force-run', ghost: true }]
    };
  }
  return { ok: true, refs, slots };
}

/* stale：递归标记整个下游子图，遇 queued/running 停止下传 */
function propagateStale(fromId) {
  const queue = outEdges(fromId).map(e => ({ id: e.target, depth: 1 }));
  const seen = new Set();
  let changed = 0;
  while (queue.length) {
    const { id, depth } = queue.shift();
    if (seen.has(id)) continue;
    seen.add(id);
    const n = nodeById(id);
    if (!n) continue;
    if (n.runState === 'queued' || n.runState === 'running') continue;
    if (!n.stale.is) { n.stale = { is: true, reason: depth === 1 ? 'direct' : 'indirect', since: Date.now() }; changed++; }
    outEdges(id).forEach(e => queue.push({ id: e.target, depth: depth + 1 }));
  }
  if (changed) log('warn', `下游 ${changed} 个节点被标记为「上游已变更」`);
  return changed;
}
function clearStale(node) { node.stale = { is: false, reason: null, since: null }; }

/* 撤销 */
const snapshot = () => JSON.stringify({ nodes: S.nodes, edges: S.edges });
let txDepth = 0, txBase = null;
function txBegin() {
  // 有未提交的连续编辑先提交，保证撤销栈顺序与操作顺序一致
  if (txDepth === 0) { flushEdit(); txBase = snapshot(); }
  txDepth++;
}
function txEnd(label) {
  txDepth--;
  if (txDepth > 0) return;
  if (txBase !== null && txBase !== snapshot()) {
    S.undo.push({ label, data: txBase });
    if (S.undo.length > 60) S.undo.shift();
    S.redo.length = 0;
  }
  txBase = null;
}
function txRun(label, fn) { txBegin(); try { fn(); } finally { txEnd(label); } }
function undo() {
  flushEdit();   // 未提交的连续编辑先落栈，否则第一次撤销会跳步
  if (!S.undo.length) { toast('没有可撤销的操作', ''); return; }
  const e = S.undo.pop();
  S.redo.push({ label: e.label, data: snapshot() });
  const p = JSON.parse(e.data); S.nodes = p.nodes; S.edges = p.edges; S.sel.clear();
  renderAll(); log('info', `撤销：${e.label}`);
}
function redo() {
  if (!S.redo.length) { toast('没有可重做的操作', ''); return; }
  const e = S.redo.pop();
  S.undo.push({ label: e.label, data: snapshot() });
  const p = JSON.parse(e.data); S.nodes = p.nodes; S.edges = p.edges; S.sel.clear();
  renderAll(); log('info', `重做：${e.label}`);
}

/* 节点 */
function createNode(type, x, y, extra = {}) {
  const seq = ++S.titleSeq[type];
  const base = {
    id: uid('n'), type, title: `${TYPE_LABEL[type]} ${seq}`, x, y,
    collapsed: false, runState: 'idle', stale: { is: false, reason: null, since: null },
    output: null, error: null, warn: null, lastRunAt: null, refBindings: {}, progress: 0
  };
  if (type === 'text')  Object.assign(base, { textMode: 'gen', prompt: '', content: '', model: MODELS.text[0].k });
  if (type === 'image') Object.assign(base, { mode: 't2i', prompt: '', model: MODELS.image[0].k, aspect: '4:3', count: 1, strength: 0.75 });
  if (type === 'video') Object.assign(base, { mode: 't2v', prompt: '', model: MODELS.video[0].k, duration: 5, resolution: '1080p' });
  if (type === 'group') Object.assign(base, { childIds: [], execMode: 'serial' });
  return Object.assign(base, extra);
}

function addNode(type, x, y, extra, quiet) {
  const n = createNode(type, x, y, extra);
  txRun(`新建${TYPE_LABEL[type]}节点`, () => { S.nodes.push(n); });
  if (!quiet) { S.sel.clear(); S.sel.add(n.id); log('ok', `新建「${n.title}」`); }
  renderAll();
  return n;
}

function deleteNode(id) {
  const n = nodeById(id);
  if (!n) return;
  const victims = outEdges(id).map(e => e.target);
  txRun(`删除「${n.title}」`, () => {
    S.edges = S.edges.filter(e => e.source !== id && e.target !== id);
    S.nodes = S.nodes.filter(x => x.id !== id);
    S.nodes.forEach(x => { if (x.parentId === id) x.parentId = null; });
  });
  S.sel.delete(id);
  victims.forEach((v) => {
    const t = nodeById(v);
    if (t) { t.stale = { is: true, reason: 'direct', since: Date.now() }; propagateStale(v); }
  });
  renderAll();
  if (victims.length) log('warn', `下游 ${victims.length} 个节点被标记为失效`);
}

function duplicateNode(id) {
  const src = nodeById(id);
  if (!src) return;
  const copy = createNode(src.type, src.x + 34, src.y + 34);
  copy.title = src.title + ' 副本';
  ['prompt', 'content', 'model', 'textMode', 'mode', 'aspect', 'count', 'strength', 'duration', 'resolution', 'output']
    .forEach(k => { if (k in src) copy[k] = src[k]; });
  copy.refBindings = { ...src.refBindings };
  copy.runState = ['queued', 'running'].includes(src.runState) ? 'idle' : src.runState;

  txRun(`复制「${src.title}」`, () => {
    S.nodes.push(copy);
    inEdges(id).forEach(e => S.edges.push({ id: uid('e'), source: e.source, target: copy.id, order: e.order }));
    outEdges(id).forEach((e) => {
      const maxOrder = Math.max(0, ...inEdges(e.target).map(x => x.order));
      S.edges.push({ id: uid('e'), source: copy.id, target: e.target, order: maxOrder + 1 });
    });
  });
  S.sel.clear(); S.sel.add(copy.id);
  renderAll();
  log('ok', `复制「${src.title}」：入边 ${inEdges(id).length}、出边 ${outEdges(id).length} 一并带上`);
}

/* 生成模拟 */
async function runNode(node, force) {
  if (node.runState === 'running' || node.runState === 'queued') { toast('该节点正在生成中', 'warn'); return; }
  const check = checkGenerate(node);
  if (!check.ok) {
    node.error = check.message; node.runState = 'failed';
    renderAll(); toast(check.message, 'err'); log('err', `${check.code} · ${check.message}`);
    return;
  }
  if (check.warn === 'W_UNREF' && !force) {
    node.warn = { message: check.message, actions: check.actions };
    renderAll(); log('warn', `W_UNREF · ${check.message}`);
    return;
  }
  node.error = null; node.warn = null; node.runState = 'queued'; node.progress = 0;
  renderAll(); log('info', `「${node.title}」进入队列`);
  await sleep(220);
  node.runState = 'running'; renderAll();
  for (let p = 0; p <= 100; p += 20) { node.progress = p; renderNode(node); await sleep(160); }
  node.output = makeOutput(node);
  if (node.type === 'text') node.content = node.output.value;
  node.runState = 'success'; node.progress = 100; node.lastRunAt = Date.now();
  clearStale(node);
  renderAll(); log('ok', `「${node.title}」生成成功`);
  propagateStale(node.id);
  renderAll();
}

const LOREM = [
  '一束暖光从左侧斜切进来，落在桌面的金属边缘上，反射出细窄的高光。整体低饱和，胶片颗粒感明显。',
  '画面以冷色调为主，远景是雾中的山脊线，近景草叶带露水，镜头缓慢向右平移。',
  '主体居中，背景大面积留白，光线柔和均匀，材质强调哑光质感与细腻的织纹。'
];
function makeOutput(node) {
  const seed = hash(node.prompt + node.id);
  if (node.type === 'text')  return { kind: 'text', value: LOREM[seed % LOREM.length] };
  if (node.type === 'image') return { kind: 'image', hue: seed % 360, value: `${node.aspect} · 已生成` };
  if (node.type === 'video') return { kind: 'video', hue: seed % 360, value: `${node.duration}s · ${node.resolution}` };
  return { kind: 'none' };
}
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ==========================================================================
   B · 画布几何与边渲染
   ========================================================================== */

const viewportEl = document.getElementById('viewport');
const worldEl = document.getElementById('world');
const nodeLayer = document.getElementById('nodeLayer');
const edgeLayer = document.getElementById('edgeLayer');
const zoomVal = document.getElementById('zoomVal');

function applyView() {
  worldEl.style.transform = `translate(${S.view.x}px, ${S.view.y}px) scale(${S.view.k})`;
  zoomVal.textContent = Math.round(S.view.k * 100) + '%';
}
function screenToWorld(cx, cy) {
  const r = viewportEl.getBoundingClientRect();
  return { x: (cx - r.left - S.view.x) / S.view.k, y: (cy - r.top - S.view.y) / S.view.k };
}
function zoomAt(cx, cy, factor) {
  const k = Math.min(1.8, Math.max(0.3, S.view.k * factor));
  const r = viewportEl.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  S.view.x = px - (px - S.view.x) * (k / S.view.k);
  S.view.y = py - (py - S.view.y) * (k / S.view.k);
  S.view.k = k; applyView();
}
function centerOf() {
  const r = viewportEl.getBoundingClientRect();
  return screenToWorld(r.left + r.width / 2, r.top + r.height / 2);
}
function measureAll() {
  nodeLayer.querySelectorAll('.node').forEach(el => { S.measure[el.dataset.id] = { w: el.offsetWidth, h: el.offsetHeight }; });
}
function fitView() {
  if (!S.nodes.length) return;
  const r = viewportEl.getBoundingClientRect();
  const xs = S.nodes.map(n => n.x), ys = S.nodes.map(n => n.y);
  const ws = S.nodes.map(n => (S.nodes.length && S.measure[n.id]?.w) || 392);
  const hs = S.nodes.map(n => (S.nodes.length && S.measure[n.id]?.h) || 300);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const maxX = Math.max(...xs.map((x, i) => x + ws[i]));
  const maxY = Math.max(...ys.map((y, i) => y + hs[i]));
  const pad = 100;
  const k = Math.min(1.15, Math.max(0.3, Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2) / (maxY - minY))));
  S.view.k = k;
  S.view.x = (r.width - (maxX - minX) * k) / 2 - minX * k;
  S.view.y = (r.height - (maxY - minY) * k) / 2 - minY * k;
  applyView();
}
function portPos(node, side) {
  const m = S.measure[node.id] || { w: 392, h: 200 };
  return { x: node.x + (side === 'out' ? m.w : 0), y: node.y + (node.collapsed ? 22 : m.h / 2) };
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function renderEdges() {
  const parts = [];
  S.edges.forEach((e) => {
    const a = nodeById(e.source), b = nodeById(e.target);
    if (!a || !b) return;
    const p1 = portPos(a, 'out'), p2 = portPos(b, 'in');
    const { slots, idle } = computeSlots(b);
    const slot = slots.find(s => s.edge.id === e.id);
    const idleSlot = idle.find(s => s.edge.id === e.id);
    const isIdle = !slot && !!idleSlot;
    const dx = Math.max(48, Math.abs(p2.x - p1.x) * 0.44);
    const d = `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
    const dim = S.sel.size > 0 && !S.sel.has(a.id) && !S.sel.has(b.id);
    parts.push(`<g class="edge-group ${dim ? 'dim' : ''}">
      <path class="edge-hit" d="${d}" data-edge="${e.id}"></path>
      <path class="edge-line" d="${d}" stroke="${isIdle ? 'var(--t-faint)' : 'var(--accent)'}" opacity="${isIdle ? .5 : .8}"></path>
    </g>`);

    // 边标签直接显示引用编号 —— 它本来就是你要打进提示词的东西
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const code = slot ? slot.code : (idleSlot ? KIND_CODE[idleSlot.kind] + '–' : '');
    const role = slot ? slot.role : '闲置';
    const tone = { text: 'text', image: 'image', video: 'video' }[(slot || idleSlot)?.kind] || 'text';
    parts.push(`<foreignObject x="${mx - 80}" y="${my - 14}" width="160" height="28" style="overflow:visible;pointer-events:none">
      <div xmlns="http://www.w3.org/1999/xhtml" class="edge-tag ${isIdle ? 'edge-tag--idle' : ''}" style="position:relative;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex">
        ${code ? `<span class="tok tok--${tone}" style="margin:0;padding:0 4px;font-size:9.5px">${code}</span>` : ''}
        <span class="edge-tag__role">${escapeHtml(role)}</span>
      </div></foreignObject>`);
  });

  if (S.linking) {
    const a = nodeById(S.linking.fromId);
    if (a) {
      const p1 = portPos(a, 'out'), p2 = { x: S.linking.x1, y: S.linking.y1 };
      const dx = Math.max(48, Math.abs(p2.x - p1.x) * 0.44);
      parts.push(`<path class="link-preview ${S.linking.valid === false ? 'reject' : ''}"
        d="M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}"></path>`);
    }
  }

  edgeLayer.innerHTML = parts.join('');
  edgeLayer.style.cssText += ';left:-4000px;top:-4000px;transform:translate(4000px,4000px);width:1px;height:1px;overflow:visible';
}

/* ---------------------------------------------------------- 富文本字段 */
function tokenChipHTML(r) {
  const cls = r.status === 'ok' ? `tok--${r.kind}` : (r.status === 'orphan' ? 'tok--orphan' : 'tok--beyond');
  const tip = r.status === 'ok'
    ? `${r.slot.role} · 来自「${r.slot.src.title}」`
    : (r.status === 'orphan' ? '来源连线已被删除' : '引用了不存在的编号');
  return `<span class="tok ${cls}" contenteditable="false" data-token="${escapeHtml(r.raw)}" title="${escapeHtml(tip)}">${escapeHtml(r.raw)}</span>`;
}
function promptInnerHTML(node) {
  const text = node.prompt || '';
  const refs = resolveRefs(node);
  let out = '', last = 0;
  refs.forEach((r) => {
    out += escapeHtml(text.slice(last, r.from)) + tokenChipHTML(r);
    last = r.to;
  });
  return out + escapeHtml(text.slice(last));
}

/** 从 contenteditable 读回纯文本（芯片的 textContent 就是 token 本身） */
function readField(el) {
  let out = '';
  el.childNodes.forEach((n) => {
    if (n.nodeType === 3) out += n.data;
    else if (n.nodeName === 'BR') out += '\n';
    else if (n.dataset?.token) out += n.dataset.token;
    else if (n.nodeType === 1) {
      const block = /^(DIV|P)$/.test(n.nodeName);
      out += (block && out && !out.endsWith('\n') ? '\n' : '') + n.textContent;
    }
  });
  return out;
}

function caretOffset(el) {
  const sel = getSelection();
  if (!sel.rangeCount) return 0;
  const range = sel.getRangeAt(0);
  if (!el.contains(range.startContainer)) return 0;
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  return pre.toString().length;
}

/** 纯文本偏移 → DOM Range（芯片按 1 个整体计长，长度 = token 文本长度） */
function rangeFromOffsets(el, from, to) {
  const range = document.createRange();
  let pos = 0, started = false;
  const visit = (parent) => {
    for (const child of parent.childNodes) {
      if (started && pos >= to) return true;
      if (child.nodeType === 3) {
        const len = child.data.length;
        if (!started && from <= pos + len) { range.setStart(child, Math.max(0, from - pos)); started = true; }
        if (started && to <= pos + len) { range.setEnd(child, Math.max(0, to - pos)); return true; }
        pos += len;
      } else if (child.nodeName === 'BR') {
        const idx = [...parent.childNodes].indexOf(child);
        if (!started && from <= pos) { range.setStart(parent, idx); started = true; }
        if (started && to <= pos) { range.setEnd(parent, idx); return true; }
        pos += 1;
      } else {
        const len = child.textContent.length;
        if (!started && from <= pos + len) { range.setStartBefore(child); started = true; }
        if (started && to <= pos + len) { range.setEndAfter(child); return true; }
        pos += len;
      }
    }
    return false;
  };
  visit(el);
  if (!started) { range.selectNodeContents(el); range.collapse(false); }
  else if (!range.endContainer) range.collapse(false);
  return range;
}

function setCaret(el, offset) {
  const r = rangeFromOffsets(el, offset, offset);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

/** 就地刷新芯片状态，不动文本节点 —— 必须保住光标 */
function refreshTokenClasses(el, node) {
  const map = new Map(resolveRefs(node).map(r => [r.raw, r]));
  el.querySelectorAll('.tok').forEach((chip) => {
    const r = map.get(chip.dataset.token);
    if (!r) return;
    chip.className = 'tok ' + (r.status === 'ok' ? `tok--${r.kind}` : (r.status === 'orphan' ? 'tok--orphan' : 'tok--beyond'));
    chip.title = r.status === 'ok' ? `${r.slot.role} · 来自「${r.slot.src.title}」`
      : (r.status === 'orphan' ? '来源连线已被删除' : '引用了不存在的编号');
  });
}

/* ------------------------------------------------------------ 卡片片段 */
function statusHTML(node) {
  if (node.runState === 'running') return `<span class="status status--busy"><i></i>生成中 ${node.progress || 0}%</span>`;
  if (node.runState === 'queued')  return `<span class="status status--busy"><i></i>排队中</span>`;
  if (node.runState === 'failed')  return `<span class="status status--fail"><i></i>失败</span>`;
  const done = node.type === 'text' ? !!(node.content || '').trim() : !!node.output;
  if (node.runState === 'success' || done) return `<span class="status status--ok"><i></i>已就绪</span>`;
  return `<span class="status status--idle"><i></i>待生成</span>`;
}

function noticeHTML(node) {
  const out = [];
  if (node.stale?.is) {
    const t = node.stale.reason === 'indirect' ? '间接上游已变更，建议重新生成。' : '上游数据已变更，建议重新生成。';
    out.push(`<div class="notice notice--stale"><span class="notice__text">${t}</span>
      <button data-act="update-run">更新生成</button>
      <button class="ghost" data-act="dismiss-stale">关闭提示</button></div>`);
  }
  if (node.runState === 'failed' && node.error) {
    out.push(`<div class="notice notice--error"><span class="notice__text">${escapeHtml(node.error)}</span>
      <button data-act="remove-orphans">移除引用</button></div>`);
  }
  if (node.warn) {
    out.push(`<div class="notice notice--warn"><span class="notice__text">${escapeHtml(node.warn.message)}</span>
      ${node.warn.actions.map(a => `<button data-act="${a.act}" class="${a.ghost ? 'ghost' : ''}">${a.label}</button>`).join('')}</div>`);
  }
  return out.join('');
}

function mediaHTML(node) {
  if (node.runState === 'running' || node.runState === 'queued') {
    return `<div class="media"><div class="media__overlay">
      <div class="spinner"></div>
      <span style="font-size:10.5px;color:var(--t-mid)">${node.runState === 'queued' ? '排队中…' : `生成中 ${node.progress || 0}%`}</span></div></div>`;
  }
  if (node.output?.kind === 'image') {
    const h = node.output.hue;
    return `<div class="media"><div class="media__fill" style="background:
      radial-gradient(circle at 26% 22%, hsl(${h} 82% 72%) 0%, transparent 46%),
      radial-gradient(circle at 78% 70%, hsl(${(h + 52) % 360} 74% 58%) 0%, transparent 50%),
      radial-gradient(circle at 58% 12%, hsl(${(h + 320) % 360} 70% 66%) 0%, transparent 40%),
      linear-gradient(158deg, hsl(${h} 58% 46%), hsl(${(h + 42) % 360} 62% 32%))"></div>
      <span class="media__meta">${escapeHtml(node.output.value)}</span></div>`;
  }
  if (node.output?.kind === 'video') {
    return `<div class="media media--wide"><div class="media__fill" style="display:grid;place-items:center;background:
      linear-gradient(150deg, hsl(${node.output.hue} 20% 17%), hsl(${(node.output.hue + 40) % 360} 26% 9%))">
      <span style="width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#111">
        <span style="width:15px;height:15px;display:block;margin-left:2px">${ICON.play}</span></span></div>
      <span class="media__meta">${escapeHtml(node.output.value)}</span></div>`;
  }
  const empty = node.type === 'image'
    ? `<span>${ICON.img}</span><span>空 · 生成或上传图片</span>`
    : `<span>${ICON.vid}</span><span>空 · 生成或上传视频</span>`;
  return `<div class="media media--empty ${node.type === 'video' ? 'media--wide' : ''}">${empty}</div>`;
}

function peekHTML(node) {
  if (node.type === 'text') {
    const t = (node.content || '').trim();
    return t ? `<span class="peek__line">${escapeHtml(t)}</span>` : `<div class="peek__none">还没有内容</div>`;
  }
  if (node.output?.kind === 'image') {
    const h = node.output.hue;
    return `<div class="peek__strip"><div class="media__fill" style="background:
      radial-gradient(circle at 30% 30%, hsl(${h} 78% 68%) 0%, transparent 52%),
      linear-gradient(150deg, hsl(${h} 54% 44%), hsl(${(h + 42) % 360} 58% 30%))"></div></div>`;
  }
  if (node.output?.kind === 'video') {
    return `<div class="peek__strip" style="background:linear-gradient(150deg, hsl(${node.output.hue} 20% 17%), #0b0f16)">
      <span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);color:#111">
        <span style="width:10px;height:10px;display:block;margin-left:1px">${ICON.play}</span></span></div>`;
  }
  return `<div class="peek__none">还没有产出</div>`;
}

function mchip(act, label, opts = {}) {
  return `<button class="mchip ${opts.mode ? 'mchip--mode' : ''}" data-act="${act}">
    ${opts.dot ? `<span class="mchip__dot" style="background:${opts.dot}"></span>` : ''}
    <span>${escapeHtml(label)}</span>${ICON.chev}</button>`;
}

function metaHTML(node) {
  const def = modeOf(node);
  const out = [];
  if (node.type !== 'text') out.push(mchip('pick-mode', def.label, { mode: true }));
  const modelLabel = MODELS[node.type].find(m => m.k === node.model)?.l || MODELS[node.type][0].l;
  out.push(mchip('pick-model', modelLabel, { dot: `var(--tone-${node.type === 'text' ? 'text' : node.type})` }));
  if (node.type === 'image') {
    out.push(mchip('pick-aspect', node.aspect));
    out.push(mchip('pick-count', `x${node.count}`));
  }
  if (node.type === 'video') {
    out.push(mchip('pick-res', node.resolution));
    out.push(mchip('pick-dur', `${node.duration}s`));
  }
  return `<div class="card-meta">${out.join('')}</div>`;
}

function cardHTML(node) {
  if (node.type === 'group') {
    return `<div class="group-title" data-role="title" title="双击重命名">${escapeHtml(node.title)}</div>
      <div class="card-head" style="height:36px">
        <span class="card-head__title" style="color:var(--t-mid);font-weight:600">${node.childIds.length} 个节点</span>
        <span style="flex:1"></span>
        <button class="tbtn" data-act="run-group" title="运行本组">${ICON.runall}</button>
        <button class="tbtn tbtn--danger" data-act="delete" title="解散并删除">${ICON.trash}</button>
      </div>`;
  }

  const busy = node.runState === 'running' || node.runState === 'queued';
  const canSend = node.type !== 'text' || true;

  const toolbar = `<div class="toolbar">
    <button class="tbtn" data-act="duplicate" title="创建副本">${ICON.copy}</button>
    <button class="tbtn" data-act="toggle-collapse" title="${node.collapsed ? '展开' : '折叠'}">${node.collapsed ? ICON.unfold : ICON.fold}</button>
    <span class="toolbar__sep"></span>
    <button class="tbtn tbtn--danger" data-act="delete" title="删除">${ICON.trash}</button>
  </div>`;

  const isText = node.type === 'text';
  const stage = isText
    ? `<div class="card-body"><div class="stage">
        <div class="pfield" contenteditable="true" spellcheck="false" data-field="content"
          data-placeholder="写点什么…">${escapeHtml(node.content || '')}</div></div></div>`
    : `<div class="card-body"><div class="stage">${mediaHTML(node)}</div></div>`;

  const promptField = `<div class="pfield pfield--well" contenteditable="true" spellcheck="false" data-field="prompt"
    data-placeholder="${isText ? '给这段文字一个改写要求…  输入 @ 引用上游' : '描述要生成的内容…  输入 @ 引用上游'}">${promptInnerHTML(node)}</div>`;

  const inCount = inEdges(node.id).length;
  const refCount = resolveRefs(node).filter(r => r.status === 'ok').length;
  const note = inCount
    ? `已连入 <b>${inCount}</b> 个上游 · 引用 <b>${refCount}</b> 个`
    : `未连接上游`;
  // 文本节点只有模型一个选项，放到底部动作条，不在中间单开一行
  const modelLabel = MODELS[node.type].find(m => m.k === node.model)?.l || MODELS[node.type][0].l;
  const leadChip = isText ? mchip('pick-model', modelLabel, { dot: 'var(--tone-text)' }) : '';

  return `${toolbar}
    <div class="card-head">
      <span class="card-head__dot"></span>
      <span class="card-head__title" data-role="title" title="双击重命名">${escapeHtml(node.title)}</span>
      ${statusHTML(node)}
    </div>
    ${noticeHTML(node)}
    ${stage}
    ${isText ? '' : metaHTML(node)}
    ${promptField}
    <div class="card-actions">
      ${leadChip}
      <span class="card-actions__note">${note}</span>
      <button class="send ${busy ? 'is-stop' : ''}" data-act="send" title="${busy ? '取消生成' : '发送生成'}">${busy ? ICON.stop : ICON.send}</button>
    </div>
    <div class="port port--in" data-port="in" title="输入端口 · 多个上游都接这里">
      <span class="port__count" data-act="open-refpop" title="调整引用顺序">${inCount}</span>
    </div>
    <div class="port port--out" data-port="out" title="输出端口 · 从此拖线"></div>`;
}

/* 整卡重建会丢光标，先记下再还原 */
function captureFocus() {
  const el = document.activeElement;
  if (!el?.dataset?.field) return null;
  const host = el.closest('.node');
  if (!host) return null;
  return { id: host.dataset.id, field: el.dataset.field, offset: caretOffset(el) };
}
function restoreFocus(snap) {
  if (!snap) return;
  const host = nodeLayer.querySelector(`.node[data-id="${snap.id}"]`);
  const el = host?.querySelector(`[data-field="${snap.field}"]`);
  if (!el) return;
  el.focus();
  try { setCaret(el, snap.offset); } catch (_) {}
}

function renderNode(node) {
  let el = nodeLayer.querySelector(`.node[data-id="${node.id}"]`);
  if (!el) { el = document.createElement('div'); el.dataset.id = node.id; nodeLayer.appendChild(el); }
  const cls = ['node', `node--${node.type}`];
  if (node.collapsed) cls.push('is-collapsed');
  if (S.sel.has(node.id)) cls.push('is-selected');
  if (node.runState === 'running' || node.runState === 'queued') cls.push('is-running');
  if (node.runState === 'failed') cls.push('is-failed');
  if (node.stale?.is) cls.push('is-stale');
  if (inEdges(node.id).length) cls.push('has-inbound');
  el.className = cls.join(' ');

  if (node.type === 'group') {
    el.style.cssText = `left:${node.x}px;top:${node.y}px;width:${node.w || 460}px;height:${node.h || 300}px;z-index:1`;
    el.innerHTML = cardHTML(node);
    return;
  }
  el.style.cssText = `left:${node.x}px;top:${node.y}px;z-index:${node.parentId ? 2 : (S.sel.has(node.id) ? 10 : 5)}`;
  el.innerHTML = cardHTML(node);
  // 折叠态补一条内容带，保留「一眼知道里面是什么」的能力
  if (node.collapsed) {
    const peek = document.createElement('div');
    peek.className = 'peek';
    peek.innerHTML = peekHTML(node);
    el.insertBefore(peek, el.querySelector('.port--in'));
  }
}

function renderNodes() {
  const snap = captureFocus();
  const alive = new Set(S.nodes.map(n => n.id));
  nodeLayer.querySelectorAll('.node').forEach(el => { if (!alive.has(el.dataset.id)) el.remove(); });
  [...S.nodes].sort((a, b) => (a.type === 'group' ? -1 : 1) - (b.type === 'group' ? -1 : 1)).forEach(renderNode);
  measureAll();
  restoreFocus(snap);
}
function renderAll() { renderNodes(); renderEdges(); renderLog(); }

/* ==========================================================================
   D · 浮层：菜单 / @ 引用 / 引用顺序 / 日志 / toast
   ========================================================================== */

let openMenu = null, openRefpop = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
function closeRefpop() { if (openRefpop) { openRefpop.remove(); openRefpop = null; } }

function showMenu(x, y, html, onPick) {
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu'; el.innerHTML = html;
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 10)) + 'px';
  el.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 10)) + 'px';
  el.addEventListener('mousedown', e => e.stopPropagation());
  el.addEventListener('click', (e) => {
    const item = e.target.closest('[data-value]');
    if (!item || item.classList.contains('is-disabled')) return;
    e.stopPropagation();
    onPick(item.dataset.value, item);
  });
  openMenu = el;
  return el;
}
function menuItems(items) {
  return items.map(it => `<button class="menu__item ${it.disabled ? 'is-disabled' : ''}" data-value="${it.value}">
    ${it.color ? `<i style="background:${it.color}">${it.badge || ''}</i>` : ''}
    <span>${escapeHtml(it.label)}</span>${it.note ? `<small>${escapeHtml(it.note)}</small>` : ''}</button>`).join('');
}

/* @ 引用菜单 */
const mention = { open: false, nodeId: null, at: -1, active: 0, items: [] };

function mentionCandidates(node) {
  return computeSlots(node).slots.map((s, i) => ({ value: s.edge.id, code: s.code, kind: s.kind, role: s.role, name: s.src.title, index: i }));
}

function openMention(node, fieldEl, at, query) {
  const cands = mentionCandidates(node);
  mention.open = true; mention.nodeId = node.id; mention.at = at; mention.active = 0;
  mention.items = cands.filter(c => !query || `${c.code} ${c.name} ${c.role} ${c.kind}`.toLowerCase().includes(query.toLowerCase()));

  let el = document.getElementById('mentionMenu');
  if (!el) {
    el = document.createElement('div');
    el.className = 'menu mention'; el.id = 'mentionMenu';
    el.addEventListener('mousedown', e => e.preventDefault());
    document.body.appendChild(el);
  }
  if (!cands.length) {
    el.innerHTML = `<div class="menu__title">引用上游素材</div><div class="menu__empty">暂无可引用资产<br>请先从左侧端口连入</div>`;
  } else if (!mention.items.length) {
    el.innerHTML = `<div class="menu__title">引用上游素材</div><div class="menu__empty">没有匹配「${escapeHtml(query)}」的素材</div>`;
  } else {
    el.innerHTML = `<div class="menu__title">引用上游素材</div>` + mention.items.map((c, i) =>
      `<button class="menu__item ${i === mention.active ? 'is-active' : ''}" data-value="${c.value}">
        <i style="background:var(--tone-${c.kind})">${c.code}</i>
        <span>${escapeHtml(c.name)}</span><small>${c.role}</small></button>`).join('')
      + `<div class="menu__hint">Tab 插入 · Shift+Tab 全部插入 · Esc 取消</div>`;
  }
  const r = fieldEl.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - 266)) + 'px';
  el.style.top = Math.max(8, Math.min(r.top + 30, innerHeight - 260)) + 'px';
  el.style.display = 'block';
}

function closeMention(revert) {
  const el = document.getElementById('mentionMenu');
  if (!el || !mention.open) return;
  el.style.display = 'none';
  if (revert) {
    const node = nodeById(mention.nodeId);
    const f = nodeLayer.querySelector(`.node[data-id="${mention.nodeId}"] [data-field="prompt"]`);
    if (node && f) {
      const caret = caretOffset(f);
      node.prompt = node.prompt.slice(0, mention.at) + node.prompt.slice(caret);
      f.innerHTML = promptInnerHTML(node);
      setCaret(f, mention.at);
    }
  }
  mention.open = false;
}

function insertMention(edgeId) {
  const node = nodeById(mention.nodeId);
  const f = nodeLayer.querySelector(`.node[data-id="${mention.nodeId}"] [data-field="prompt"]`);
  if (!node || !f) return;
  const cand = mentionCandidates(node).find(c => c.value === edgeId);
  if (!cand) return;
  const caret = caretOffset(f);
  const key = `${KIND_TITLE[cand.kind]} ${cand.index + 1}`;
  const token = `{{${key}}}`;
  node.prompt = node.prompt.slice(0, mention.at) + token + ' ' + node.prompt.slice(caret);
  node.refBindings = { ...node.refBindings, [key]: edgeId };
  mention.open = false;
  document.getElementById('mentionMenu').style.display = 'none';
  renderAll();
  const host = nodeLayer.querySelector(`.node[data-id="${node.id}"] [data-field="prompt"]`);
  if (host) { host.focus(); setCaret(host, mention.at + token.length + 1); }
  log('ok', `在「${node.title}」插入引用 ${token}`);
}

function insertAllMentions() {
  const node = nodeById(mention.nodeId);
  const f = nodeLayer.querySelector(`.node[data-id="${mention.nodeId}"] [data-field="prompt"]`);
  if (!node || !f) return;
  const cands = mentionCandidates(node);
  if (!cands.length) return;
  const caret = caretOffset(f);
  const tokens = cands.map(c => `{{${KIND_TITLE[c.kind]} ${c.index + 1}}}`);
  node.prompt = node.prompt.slice(0, mention.at) + tokens.join(' ') + ' ' + node.prompt.slice(caret);
  const bind = { ...node.refBindings };
  cands.forEach(c => { bind[`${KIND_TITLE[c.kind]} ${c.index + 1}`] = c.value; });
  node.refBindings = bind;
  mention.open = false;
  document.getElementById('mentionMenu').style.display = 'none';
  renderAll();
  log('ok', `在「${node.title}」插入全部 ${tokens.length} 条引用`);
}

function moveMention(d) {
  if (!mention.items.length) return;
  mention.active = (mention.active + d + mention.items.length) % mention.items.length;
  const el = document.getElementById('mentionMenu');
  const btns = [...el.querySelectorAll('.menu__item')];
  btns.forEach((b, i) => b.classList.toggle('is-active', i === mention.active));
  btns[mention.active]?.scrollIntoView({ block: 'nearest' });
}

/* 引用顺序浮层：点输入端口才出现 */
function openRefPop(node, anchorEl) {
  closeMenu(); closeRefpop();
  const { slots, idle } = computeSlots(node);
  if (!slots.length && !idle.length) { toast('这个节点还没有连入上游', ''); return; }
  const rows = slots.map(s => `<div class="refpop__row" draggable="true" data-slot="${s.edge.id}">
      <span class="refpop__grip">${ICON.grip}</span>
      <span class="refpop__code" style="background:var(--tone-${s.kind})">${s.code}</span>
      <span class="refpop__name">${escapeHtml(s.src.title)}</span>
      <span class="refpop__role">${s.role}</span>
      <button class="refpop__x" data-act="cut-edge" data-edge="${s.edge.id}">${ICON.x}</button></div>`).join('');
  const idleRows = idle.map(s => `<div class="refpop__row refpop__idle" data-slot="${s.edge.id}">
      <span class="refpop__grip">${ICON.grip}</span>
      <span class="refpop__code">${s.label}–</span>
      <span class="refpop__name">${escapeHtml(s.src.title)}</span>
      <span class="refpop__role">闲置</span>
      <button class="refpop__x" data-act="cut-edge" data-edge="${s.edge.id}">${ICON.x}</button></div>`).join('');

  const el = document.createElement('div');
  el.className = 'menu refpop'; el.id = 'refpop';
  el.innerHTML = `<div class="menu__title">引用顺序 · 拖拽调整</div>${rows}${idleRows}
    <div class="menu__hint">顺序决定正文里 {{Image N}} 的编号，调整后会自动重写</div>`;
  document.body.appendChild(el);
  el.addEventListener('mousedown', e => e.stopPropagation());

  const r = anchorEl.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.left - er.width - 12, innerWidth - er.width - 10)) + 'px';
  el.style.top = Math.max(8, Math.min(r.top - 8, innerHeight - er.height - 10)) + 'px';
  openRefpop = el;

  // 拖拽重排
  let dragging = null;
  el.addEventListener('dragstart', (e) => {
    const row = e.target.closest('.refpop__row[draggable]');
    if (!row) return;
    dragging = row.dataset.slot; row.classList.add('is-dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragover', (e) => {
    const row = e.target.closest('.refpop__row[draggable]');
    if (!row || !dragging) return;
    e.preventDefault();
    el.querySelectorAll('.is-over').forEach(x => x.classList.remove('is-over'));
    row.classList.add('is-over');
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    const row = e.target.closest('.refpop__row[draggable]');
    el.querySelectorAll('.is-over,.is-dragging').forEach(x => x.classList.remove('is-over', 'is-dragging'));
    if (row && dragging) { const from = dragging; dragging = null; reorderEdges(node.id, from, row.dataset.slot); openRefPop(nodeById(node.id), anchorEl); }
  });
  el.addEventListener('dragend', () => {
    el.querySelectorAll('.is-over,.is-dragging').forEach(x => x.classList.remove('is-over', 'is-dragging'));
    dragging = null;
  });
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act="cut-edge"]');
    if (!btn) return;
    e.stopPropagation();
    cutEdge(btn.dataset.edge);
    closeRefpop();
  });
}

/* 日志 / toast */
const logs = [];
function log(kind, text) {
  logs.push({ kind, text, t: new Date() });
  if (logs.length > 200) logs.shift();
  renderLog();
}
function renderLog() {
  const body = document.getElementById('logBody');
  if (!body) return;
  document.getElementById('logCount').textContent = logs.length;
  body.innerHTML = logs.slice(-60).map(l => `<div class="logline logline--${l.kind}">
    <time>${String(l.t.getHours()).padStart(2, '0')}:${String(l.t.getMinutes()).padStart(2, '0')}:${String(l.t.getSeconds()).padStart(2, '0')}</time>
    <span>${escapeHtml(l.text)}</span></div>`).join('');
  body.scrollTop = body.scrollHeight;
}
function toast(text, kind) {
  const host = document.getElementById('toasts');
  const dup = [...host.children].find(c => c.dataset.text === text);
  if (dup) { clearTimeout(dup._t); dup._t = setTimeout(() => fadeOut(dup), 2600); return; }
  const el = document.createElement('div');
  el.className = 'toast ' + (kind ? `toast--${kind}` : '');
  el.dataset.text = text; el.textContent = text;
  host.appendChild(el);
  while (host.children.length > 3) host.firstElementChild.remove();
  el._t = setTimeout(() => fadeOut(el), 2600);
}
function fadeOut(el) { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }

/* ==========================================================================
   E · 交互
   ========================================================================== */

let drag = null, spaceDown = false, panning = null;

/* 连续编辑合并成一次撤销：记下这一串编辑「开始前」的快照，静默 700ms 后提交。
   刻意不占用 txDepth —— 否则紧接着发生的其它操作会因为事务未关闭而丢失撤销记录。 */
let editBase = null, editLabel = '', editTimer = null;

function markEdit(label) {
  if (editBase === null) editBase = snapshot();   // 必须在改动写入 node 之前调用
  if (label) editLabel = label;
}
function flushEdit() {
  if (editTimer) { clearTimeout(editTimer); editTimer = null; }
  if (editBase !== null && editBase !== snapshot()) {
    S.undo.push({ label: editLabel || '编辑', data: editBase });
    if (S.undo.length > 60) S.undo.shift();
    S.redo.length = 0;
  }
  editBase = null; editLabel = '';
}
function resetNodeState(node) {
  node.runState = node.runState === 'failed' ? 'idle' : node.runState;
  node.error = null; node.warn = null;
}
const hasResult = (node) => (node.type === 'text' ? !!(node.content || '').trim() : !!node.output);

/** 连续输入（正文编辑）：合并为一次撤销，延迟传播 stale */
function afterEdit(node, label) {
  markEdit(label);
  resetNodeState(node);
  const changed = hasResult(node);
  if (changed) node.stale = { is: true, reason: 'direct', since: Date.now() };
  clearTimeout(editTimer);
  editTimer = setTimeout(() => {
    editTimer = null;
    flushEdit();
    if (changed && nodeById(node.id)) { propagateStale(node.id); renderAll(); }
  }, 700);
}

/** 离散操作（切模式 / 改参数）：一次一个撤销步，立即传播 stale */
function applyParam(node, label, mutate) {
  txRun(label, () => {
    mutate();
    resetNodeState(node);
    if (hasResult(node)) node.stale = { is: true, reason: 'direct', since: Date.now() };
  });
  propagateStale(node.id);
  renderAll();
}

function cutEdge(edgeId) {
  const e = edgeById(edgeId);
  if (!e) return;
  const tgt = nodeById(e.target);
  txRun('断开连线', () => { S.edges = S.edges.filter(x => x.id !== edgeId); });
  if (tgt) { renumberRefs(tgt); propagateStale(tgt.id); log('warn', `断开「${tgt.title}」的一条上游连线`); }
  renderAll();
}

/* 顺序变了就重算编号，并同步改写正文里的 token 与绑定 */
function renumberRefs(node) {
  const { slots } = computeSlots(node);
  const byEdge = new Map(slots.map(s => [s.edge.id, s]));
  const tokens = parseTokens(node.prompt);
  const reps = []; const bind = {};
  let warned = false;
  tokens.forEach((t) => {
    const bound = node.refBindings?.[t.key];
    if (!bound) { if (!slots.filter(s => s.kind === t.kind)[t.index - 1]) warned = true; return; }
    const slot = byEdge.get(bound);
    if (!slot) { bind[t.key] = bound; return; }
    const key = `${KIND_TITLE[slot.kind]} ${slot.index}`;
    if (key !== t.key) reps.push({ from: t.from, to: t.to, text: `{{${key}}}` });
    bind[key] = bound;
  });
  if (reps.length) {
    let text = node.prompt;
    reps.sort((a, b) => b.from - a.from).forEach(r => { text = text.slice(0, r.from) + r.text + text.slice(r.to); });
    node.prompt = text; node.refBindings = bind;
    log('info', `「${node.title}」的引用编号已同步重写`);
  }
  node.warn = warned ? { message: '顺序已变更，请检查正文里引用的对应关系。', actions: [] } : null;
  return warned;
}

function reorderEdges(nodeId, draggedEdgeId, targetEdgeId) {
  const node = nodeById(nodeId);
  if (!node) return;
  const list = inEdges(nodeId).map(e => e.id);
  const from = list.indexOf(draggedEdgeId), to = list.indexOf(targetEdgeId);
  if (from < 0 || to < 0 || from === to) return;
  list.splice(to, 0, list.splice(from, 1)[0]);
  txRun('重排引用顺序', () => {
    list.forEach((id, i) => { const e = edgeById(id); if (e) e.order = i + 1; });
    renumberRefs(node);
  });
  renderAll();
  log('ok', `重排「${node.title}」的引用顺序`);
}

/* ---------------------------------------------------------------- 连线 */
function startLink(node, ev) {
  S.linking = { fromId: node.id, x1: node.x, y1: node.y, valid: null, reason: '' };
  viewportEl.classList.add('linking');
  document.querySelectorAll('.port').forEach(p => p.classList.remove('is-hot', 'is-no'));
  document.querySelector(`.node[data-id="${node.id}"] .port--out`)?.classList.add('is-armed');
  updateLink(ev.clientX, ev.clientY);
}
function updateLink(cx, cy) {
  if (!S.linking) return;
  const w = screenToWorld(cx, cy);
  S.linking.x1 = w.x; S.linking.y1 = w.y;
  const hover = nodeAt(cx, cy);
  let valid = null, reason = '';
  document.querySelectorAll('.node').forEach((el) => {
    const isIt = hover && el.dataset.id === hover.id && hover.id !== S.linking.fromId;
    const res = isIt ? checkConnection(S.linking.fromId, hover.id) : null;
    el.querySelector('.port--in')?.classList.toggle('is-hot', !!(res && res.ok));
    el.querySelector('.port--in')?.classList.toggle('is-no', !!(res && !res.ok));
  });
  if (hover) { const r = checkConnection(S.linking.fromId, hover.id); valid = r.ok; reason = r.ok ? '' : r.reason; }
  S.linking.valid = valid; S.linking.reason = reason;
  renderEdges();
}
function endLink(cx, cy) {
  if (!S.linking) return;
  const from = S.linking.fromId;
  const hover = nodeAt(cx, cy);
  S.linking = null;
  viewportEl.classList.remove('linking');
  document.querySelectorAll('.port').forEach(p => p.classList.remove('is-armed', 'is-hot', 'is-no'));
  if (hover) {
    const res = checkConnection(from, hover.id);
    if (res.ok) connect(from, hover.id);
    else { toast(res.reason, 'err'); log('err', `${res.code} · ${res.reason}`); }
    renderAll();
    return;
  }
  openQuickAdd(cx, cy, from);
  renderAll();
}
function connect(sourceId, targetId, quiet) {
  const res = checkConnection(sourceId, targetId);
  if (!res.ok) { if (!quiet) toast(res.reason, 'err'); return null; }
  const order = Math.max(0, ...inEdges(targetId).map(e => e.order)) + 1;
  const edge = { id: uid('e'), source: sourceId, target: targetId, order };
  txRun('建立连线', () => { S.edges.push(edge); });
  propagateStale(targetId);
  renderAll();
  log('ok', `连接「${nodeById(sourceId).title}」→「${nodeById(targetId).title}」（第 ${order} 条入边）`);
  return edge;
}
function nodeAt(cx, cy) {
  const w = screenToWorld(cx, cy);
  for (const n of [...S.nodes].reverse()) {
    const m = S.measure[n.id];
    if (!m) continue;
    if (w.x >= n.x && w.x <= n.x + m.w && w.y >= n.y && w.y <= n.y + m.h) return n;
  }
  return null;
}

/* 拖线到空白 → 新建并连线 */
function bestModeFor(type, kind) {
  const defs = type === 'text' ? MODES.text : (type === 'image' ? MODES.image : MODES.video);
  return Object.keys(defs).find(k => (defs[k].accept[kind] || 0) > 0) || null;
}
function openQuickAdd(cx, cy, fromId) {
  const src = nodeById(fromId);
  if (!src) return;
  const opts = ['text', 'image', 'video'].map(t => ({ type: t, mode: bestModeFor(t, src.type) })).filter(o => o.mode);
  if (!opts.length) return;
  const w = screenToWorld(cx, cy);
  const items = opts.map(o => ({
    value: o.type, label: `新建${TYPE_LABEL[o.type]}节点`,
    color: `var(--tone-${o.type})`, badge: KIND_CODE[o.type], note: '自动连线'
  }));
  showMenu(cx + 8, cy + 8, `<div class="menu__title">新建节点并自动连线</div>${menuItems(items)}`, (type) => {
    closeMenu();
    const mode = bestModeFor(type, src.type);
    const extra = type === 'text' ? { textMode: mode } : { mode };
    const n = addNode(type, w.x + 64, w.y - 90, extra, true);
    connect(fromId, n.id, true);
    renderAll();
    toast(`已新建${TYPE_LABEL[type]}节点并连线`, 'ok');
  });
}

function openNodeMenu(cx, cy) {

function openModePicker(node, ev) {
  const defs = node.type === 'text' ? MODES.text : (node.type === 'image' ? MODES.image : MODES.video);
  const items = Object.entries(defs).map(([k, d]) => ({
    value: k, label: d.label,

  }));

    applyParam(node, '切换生成模式', () => {

      const idle = computeSlots(node).idle;
      if (idle.length) log('warn', `「${node.title}」切到「${defs[key].label}」：${idle.length} 条上游连线变为闲置（未删除）`);
      renumberRefs(node);
    });

}
function openOptionsPicker(node, act, ev) {
  const conf = {
    'pick-model': { title: '模型', values: MODELS[node.type].map(m => ({ value: m.k, label: m.l })), field: 'model' },

    'pick-count': { title: '生成数量', values: [1, 2, 3, 4].map(v => ({ value: v, label: `x${v}` })), field: 'count' },
    'pick-res': { title: '分辨率', values: RESOLUTIONS.map(v => ({ value: v, label: v })), field: 'resolution' },

  }[act];

/* ------------------------------------------------------ 节点内点击 */
nodeLayer.addEventListener('click', (ev) => {
  const nodeEl = ev.target.closest('.node');
  if (!nodeEl) return;
  const node = nodeById(nodeEl.dataset.id);
  if (!node) return;
  const actEl = ev.target.closest('[data-act]');
  const act = actEl?.dataset.act;
  const isField = !!ev.target.dataset?.field;

  if (!act && !isField) {
    if (ev.shiftKey) { S.sel.has(node.id) ? S.sel.delete(node.id) : S.sel.add(node.id); }
    else { S.sel.clear(); S.sel.add(node.id); }
    closeRefpop(); renderAll();
    return;
  }
  if (!act) return;
  ev.stopPropagation();

  switch (act) {
    case 'delete': closeRefpop(); deleteNode(node.id); break;
    case 'duplicate': duplicateNode(node.id); break;
    case 'toggle-collapse': node.collapsed = !node.collapsed; renderAll(); break;
    case 'open-refpop': openRefPop(node, actEl); break;
    case 'send':
      if (node.runState === 'running' || node.runState === 'queued') {
        node.runState = 'idle'; node.progress = 0; renderAll(); toast('已取消生成', ''); log('warn', `「${node.title}」已取消`);
      } else runNode(node);
      break;
    case 'update-run': runNode(node); break;
    case 'dismiss-stale': clearStale(node); renderAll(); log('info', `「${node.title}」：关闭失效提示`); break;
    case 'force-run': node.warn = null; runNode(node, true); break;
    case 'insert-refs': {
      node.warn = null;
      const cands = mentionCandidates(node);
      if (cands.length) {
        const tokens = cands.map(c => `{{${KIND_TITLE[c.kind]} ${c.index + 1}}}`);
        node.prompt = (node.prompt ? node.prompt + ' ' : '') + tokens.join(' ') + ' ';
        const bind = { ...node.refBindings };
        cands.forEach(c => { bind[`${KIND_TITLE[c.kind]} ${c.index + 1}`] = c.value; });
        node.refBindings = bind;
        log('ok', `已在「${node.title}」插入全部引用`);
      }
      renderAll(); break;
    }
    case 'remove-orphans': {
      const orphans = resolveRefs(node).filter(r => r.status === 'orphan');
      let text = node.prompt;
      orphans.sort((a, b) => b.from - a.from).forEach(r => { text = text.slice(0, r.from) + text.slice(r.to); });
      node.prompt = text.replace(/[ \t]{2,}/g, ' ').trim();
      const bind = { ...node.refBindings };
      orphans.forEach(r => delete bind[r.key]);
      node.refBindings = bind;
      node.error = null; node.runState = 'idle';
      renderAll(); toast(`已移除 ${orphans.length} 条失效引用`, 'ok'); break;
    }
    case 'cut-edge': cutEdge(ev.target.closest('[data-edge]').dataset.edge); break;
    case 'run-group': runGroup(node); break;
    case 'pick-mode': openModePicker(node, ev); break;
    case 'pick-model': case 'pick-aspect': case 'pick-count': case 'pick-res': case 'pick-dur':
      openOptionsPicker(node, act, ev); break;
  }
});

/* 双击标题重命名 */
nodeLayer.addEventListener('dblclick', (ev) => {

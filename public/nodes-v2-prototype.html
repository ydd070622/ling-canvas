/* -------------------------------------------------- 正文编辑（contenteditable） */
function syncField(el, node) {
  const value = readField(el);
  if (el.dataset.field === 'content') {
    markEdit('编辑内容');
    node.content = value;
    afterEdit(node, '编辑内容');
    return;
  }
  markEdit('编辑提示词');
  node.prompt = value;
  refreshTokenClasses(el, node);
  const note = el.closest('.node')?.querySelector('.card-actions__note');
  if (note) {
    const inCount = inEdges(node.id).length;
    note.innerHTML = inCount ? `已连入 <b>${inCount}</b> 个上游 · 引用 <b>${resolveRefs(node).filter(r => r.status === 'ok').length}</b> 个` : '未连接上游';
  }
  afterEdit(node, '编辑提示词');
}

nodeLayer.addEventListener('input', (ev) => {
  const el = ev.target;
  if (!el.dataset?.field) return;
  const node = nodeById(el.closest('.node')?.dataset.id);
  if (!node) return;
  syncField(el, node);
  if (el.dataset.field !== 'prompt') return;
  const caret = caretOffset(el);
  const upto = (node.prompt || '').slice(0, caret);
  const at = upto.lastIndexOf('@');
  const tail = upto.slice(at + 1);
  if (at >= 0 && (at === 0 || /\s/.test(upto[at - 1])) && !/\s/.test(tail)) openMention(node, el, at, tail);
  else if (mention.open) closeMention(false);
});

function insertTextAtCaret(text) {
  const sel = getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const t = document.createTextNode(text);
  range.insertNode(t);
  range.setStartAfter(t); range.collapse(true);
  sel.removeAllRanges(); sel.addRange(range);
}

nodeLayer.addEventListener('keydown', (ev) => {
  const el = ev.target;
  if (!el.dataset?.field) return;
  const node = nodeById(el.closest('.node')?.dataset.id);

  if (mention.open && el.dataset.field === 'prompt') {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); return moveMention(1); }
    if (ev.key === 'ArrowUp')   { ev.preventDefault(); return moveMention(-1); }
    if (ev.key === 'Tab') {
      ev.preventDefault();
      return ev.shiftKey ? insertAllMentions() : (mention.items[mention.active] && insertMention(mention.items[mention.active].value));
    }
    if (ev.key === 'Enter' && mention.items.length) { ev.preventDefault(); return insertMention(mention.items[mention.active].value); }
    if (ev.key === 'Escape') { ev.preventDefault(); return closeMention(true); }
  }
  if (ev.key === 'Enter') {
    ev.preventDefault();
    insertTextAtCaret('\n');
    if (node) syncField(el, node);
  }
  if (ev.key === 'Escape' && mention.open) closeMention(true);
});

/* -------------------------------------------------- 画布：平移 / 缩放 / 双击 */
viewportEl.addEventListener('mousedown', (ev) => {
  const portEl = ev.target.closest('.port');
  const nodeEl = ev.target.closest('.node');
  const onHead = ev.target.closest('.card-head, .group-title');
  const interactive = ev.target.closest('[contenteditable], button, [data-act], .menu');

  if (portEl) {
    ev.preventDefault();
    if (portEl.dataset.port === 'out') startLink(nodeById(nodeEl.dataset.id), ev);
    return;
  }
  if (nodeEl && onHead && !interactive) {
    ev.preventDefault();
    const node = nodeById(nodeEl.dataset.id);
    if (!S.sel.has(node.id)) { S.sel.clear(); S.sel.add(node.id); renderAll(); }
    const ids = [...S.sel];
    const w = screenToWorld(ev.clientX, ev.clientY);
    drag = {
      ids, sx: w.x, sy: w.y,
      origins: new Map(ids.map(id => [id, { x: nodeById(id).x, y: nodeById(id).y }])),
      before: snapshot()
    };
    ids.forEach(id => nodeLayer.querySelector(`.node[data-id="${id}"]`)?.classList.add('is-dragging'));
    return;
  }
  if (nodeEl) return;
  if (ev.button === 1 || spaceDown || ev.target.closest('.viewport')) {
    ev.preventDefault();
    panning = { sx: ev.clientX, sy: ev.clientY, ox: S.view.x, oy: S.view.y };
    viewportEl.classList.add('panning');
  }
});

viewportEl.addEventListener('dblclick', (ev) => {
  if (ev.target.closest('.node')) return;
  openNodeMenu(ev.clientX, ev.clientY);
});

viewportEl.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.1 : 0.9);
  else { S.view.x -= ev.deltaX; S.view.y -= ev.deltaY; applyView(); }
}, { passive: false });

window.addEventListener('mousemove', (ev) => {
  if (panning) { S.view.x = panning.ox + (ev.clientX - panning.sx); S.view.y = panning.oy + (ev.clientY - panning.sy); applyView(); return; }
  if (S.linking) { updateLink(ev.clientX, ev.clientY); return; }
  if (drag) {
    const w = screenToWorld(ev.clientX, ev.clientY);
    const dx = w.x - drag.sx, dy = w.y - drag.sy;
    drag.ids.forEach((id) => {
      const n = nodeById(id), o = drag.origins.get(id);
      if (!n || !o) return;
      n.x = Math.round((o.x + dx) / 4) * 4;
      n.y = Math.round((o.y + dy) / 4) * 4;
      const el = nodeLayer.querySelector(`.node[data-id="${id}"]`);
      if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    });
    renderEdges();
  }
});

window.addEventListener('mouseup', (ev) => {
  if (panning) { panning = null; viewportEl.classList.remove('panning'); }
  if (drag) {
    const moved = drag.ids.some((id) => {
      const n = nodeById(id), o = drag.origins.get(id);
      return n && o && (Math.abs(n.x - o.x) > 2 || Math.abs(n.y - o.y) > 2);
    });
    drag.ids.forEach(id => nodeLayer.querySelector(`.node[data-id="${id}"]`)?.classList.remove('is-dragging'));
    if (moved) {
      S.undo.push({ label: `移动 ${drag.ids.length} 个节点`, data: drag.before });
      if (S.undo.length > 60) S.undo.shift();
      S.redo.length = 0;
      log('info', `移动了 ${drag.ids.length} 个节点`);
    }
    drag = null; measureAll(); renderEdges();
  }
  if (S.linking) endLink(ev.clientX, ev.clientY);
});

viewportEl.addEventListener('click', (ev) => {

  closeMenu(); closeRefpop();

document.addEventListener('click', (ev) => {

    case 'add-group': makeGroup(); break;

    case 'reset': resetAll(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;

    case 'collapse-all': S.nodes.forEach(n => { if (n.type !== 'group') n.collapsed = true; }); renderAll(); break;
    case 'fit': fitView(); break;
    case 'autolayout': autoLayout(); break;
    case 'zoom-in': zoomAt(innerWidth / 2, innerHeight / 2, 1.15); break;
    case 'zoom-out': zoomAt(innerWidth / 2, innerHeight / 2, 0.87); break;
    case 'theme': toggleTheme(); break;
  }
});
function addPos() {
  const c = centerOf(), n = S.nodes.length;
  return [c.x - 196 + (n % 5) * 36, c.y - 130 + (n % 5) * 32];
}

function makeGroup() {
  const ids = [...S.sel].filter(id => nodeById(id)?.type !== 'group');
  if (ids.length < 2) { toast('至少选中 2 个节点才能打组', 'warn'); return; }
  const pad = 28;
  const minX = Math.min(...ids.map(id => nodeById(id).x));
  const minY = Math.min(...ids.map(id => nodeById(id).y));
  const maxX = Math.max(...ids.map(id => nodeById(id).x + (S.measure[id]?.w || 392)));
  const maxY = Math.max(...ids.map(id => nodeById(id).y + (S.measure[id]?.h || 300)));
  const g = createNode('group', minX - pad, minY - pad, { w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 });
  txRun('打组', () => {
    S.nodes.push(g);
    ids.forEach(id => { const n = nodeById(id); if (n) n.parentId = g.id; });
    g.childIds = ids;
  });
  S.sel.clear(); S.sel.add(g.id);
  renderAll(); log('ok', `已将 ${ids.length} 个节点打组`);
}

async function runGroup(group) {
  const kids = S.nodes.filter(n => n.parentId === group.id && n.type !== 'group');
  if (!kids.length) { toast('组内没有可运行的节点', 'warn'); return; }
  log('info', `运行本组：${kids.length} 个节点，串行执行`);
  for (const k of kids) if (k.runState === 'idle' || k.stale.is) await runNode(k);
  toast('本组运行完成', 'ok');
}

function autoLayout() {
  const list = S.nodes.filter(n => n.type !== 'group' && !n.parentId);
  if (!list.length) return;
  const depth = new Map();
  const calc = (n, guard) => {
    if (depth.has(n.id) || guard > 40) return depth.get(n.id) || 0;
    depth.set(n.id, 0);
    const ups = inEdges(n.id).map(e => nodeById(e.source)).filter(Boolean);
    const d = ups.length ? Math.max(...ups.map(u => calc(u, guard + 1))) + 1 : 0;
    depth.set(n.id, d); return d;
  };
  list.forEach(n => calc(n, 0));
  const cols = new Map();
  txRun('自动布局', () => {
    [...list].sort((a, b) => (depth.get(a.id) - depth.get(b.id)) || a.y - b.y).forEach((n) => {
      const d = depth.get(n.id), row = cols.get(d) || 0;
      cols.set(d, row + 1);
      n.x = 130 + d * 470;
      n.y = 130 + row * 320;
    });
  });
  renderAll();
  setTimeout(() => { measureAll(); fitView(); renderEdges(); }, 30);
  log('ok', '自动布局（仅显式命令触发）');
}

function toggleTheme() {
  S.dark = !S.dark;
  document.documentElement.classList.toggle('dark', S.dark);
  document.querySelector('.ico-sun').style.display = S.dark ? 'none' : '';
  document.querySelector('.ico-moon').style.display = S.dark ? '' : 'none';
}

function resetAll() {
  S.nodes = []; S.edges = []; S.sel.clear(); S.undo = []; S.redo = [];
  S.titleSeq = { text: 0, image: 0, video: 0, group: 0 };
  logs.length = 0;
  closeMenu(); closeRefpop();
  renderAll();
}

/* -------------------------------------------------------------- 快捷键 */
window.addEventListener('keydown', (ev) => {
  const inField = ev.target.closest?.('[contenteditable], input, textarea');
  if (ev.code === 'Space' && !inField) { spaceDown = true; viewportEl.classList.add('space-ready'); if (!ev.repeat) ev.preventDefault(); }
  if (inField) return;
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
  if (mod && ev.key.toLowerCase() === 'd' && S.sel.size) { ev.preventDefault(); [...S.sel].forEach(duplicateNode); return; }
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && S.sel.size) { ev.preventDefault(); [...S.sel].filter(id => nodeById(id)).forEach(deleteNode); return; }
  if (ev.key === 'Escape') { closeMenu(); closeRefpop(); closeMention(false); S.sel.clear(); renderAll(); }
});
window.addEventListener('keyup', (ev) => {
  if (ev.code === 'Space') { spaceDown = false; viewportEl.classList.remove('space-ready'); }
});
window.addEventListener('resize', () => { measureAll(); renderEdges(); });
document.getElementById('logHead').addEventListener('click', () => document.getElementById('logPanel').classList.toggle('is-collapsed'));
document.addEventListener('mousedown', (ev) => {
  if (openMenu && !openMenu.contains(ev.target)) closeMenu();
  if (openRefpop && !openRefpop.contains(ev.target) && !ev.target.closest('.port__count')) closeRefpop();
  if (mention.open && !ev.target.closest('#mentionMenu') && !ev.target.closest('[data-field="prompt"]')) closeMention(false);
});

/* ---------------------------------------------------------------- 启动 */
applyView();
loadDemo();
log('info', '原型 v3 就绪 · 引用长在正文里 · 引用顺序点输入端口调整');
</script>

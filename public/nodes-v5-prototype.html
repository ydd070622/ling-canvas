          &lt;button class=&quot;lc-window-btn&quot; type=&quot;button&quot; aria-label=&quot;最小化&quot;&gt;—&lt;/button&gt;
          &lt;button class=&quot;lc-window-btn&quot; type=&quot;button&quot; aria-label=&quot;最大化&quot;&gt;□&lt;/button&gt;
          &lt;button class=&quot;lc-window-btn&quot; type=&quot;button&quot; aria-label=&quot;关闭&quot;&gt;×&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;lc-stage&quot; data-role=&quot;stage&quot;&gt;
      &lt;input data-role=&quot;file-input&quot; type=&quot;file&quot; accept=&quot;image/*,video/*&quot; hidden&gt;
      &lt;div class=&quot;lc-project-title&quot;&gt;视觉实验 01&lt;/div&gt;
      &lt;div class=&quot;lc-canvas-hint&quot;&gt;双击空白添加 · 点击节点展开 · 点击画布收起&lt;/div&gt;
      &lt;aside class=&quot;lc-toolrail&quot; aria-label=&quot;画布工具栏&quot;&gt;
        &lt;button class=&quot;lc-rail-btn is-primary&quot; type=&quot;button&quot; data-action=&quot;toolbar-add&quot; aria-label=&quot;添加节点&quot;&gt;＋&lt;/button&gt;
        &lt;button class=&quot;lc-rail-btn&quot; type=&quot;button&quot; aria-label=&quot;搜索&quot;&gt;⌕&lt;/button&gt;
        &lt;button class=&quot;lc-rail-btn&quot; type=&quot;button&quot; aria-label=&quot;历史素材&quot;&gt;◷&lt;/button&gt;
        &lt;button class=&quot;lc-rail-btn&quot; type=&quot;button&quot; aria-label=&quot;素材库&quot;&gt;▦&lt;/button&gt;
      &lt;/aside&gt;
      &lt;div class=&quot;lc-canvas-controls&quot;&gt;
        &lt;button class=&quot;lc-icon-btn&quot; type=&quot;button&quot; data-action=&quot;zoom-out&quot; aria-label=&quot;缩小&quot;&gt;−&lt;/button&gt;
        &lt;span data-role=&quot;zoom-label&quot;&gt;100%&lt;/span&gt;
        &lt;button class=&quot;lc-icon-btn&quot; type=&quot;button&quot; data-action=&quot;zoom-in&quot; aria-label=&quot;放大&quot;&gt;＋&lt;/button&gt;
        &lt;button class=&quot;lc-icon-btn&quot; type=&quot;button&quot; data-action=&quot;reset&quot; aria-label=&quot;重置示例&quot;&gt;↺&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;lc-world&quot; data-role=&quot;world&quot;&gt;
        &lt;svg class=&quot;lc-links&quot; data-role=&quot;links&quot; aria-label=&quot;节点之间的连接&quot;&gt;&lt;/svg&gt;
        &lt;div class=&quot;lc-node-layer&quot; data-role=&quot;nodes&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;lc-empty-tip&quot;&gt;双击这里，新建文本 / 图片 / 视频节点&lt;/div&gt;

      &lt;div class=&quot;lc-menu&quot; data-role=&quot;menu&quot; hidden&gt;
        &lt;div class=&quot;lc-menu-head&quot; data-role=&quot;menu-title&quot;&gt;添加节点&lt;/div&gt;
        &lt;div class=&quot;lc-direction-row&quot; data-role=&quot;direction-row&quot; hidden&gt;
          &lt;button class=&quot;lc-direction-btn is-active&quot; type=&quot;button&quot; data-branch=&quot;up&quot;&gt;向上分支&lt;/button&gt;
          &lt;button class=&quot;lc-direction-btn&quot; type=&quot;button&quot; data-branch=&quot;down&quot;&gt;向下分支&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;lc-type-list&quot;&gt;
          &lt;button class=&quot;lc-type-btn&quot; type=&quot;button&quot; data-add-type=&quot;text&quot;&gt;
            &lt;span class=&quot;lc-type-symbol&quot;&gt;T&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;lc-type-name&quot;&gt;文本节点&lt;/span&gt;&lt;span class=&quot;lc-type-desc&quot;&gt;脚本、描述、提示词与分析&lt;/span&gt;&lt;/span&gt;
          &lt;/button&gt;
          &lt;button class=&quot;lc-type-btn&quot; type=&quot;button&quot; data-add-type=&quot;image&quot;&gt;
            &lt;span class=&quot;lc-type-symbol&quot;&gt;▧&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;lc-type-name&quot;&gt;图片节点&lt;/span&gt;&lt;span class=&quot;lc-type-desc&quot;&gt;上传、生成、重绘与参考&lt;/span&gt;&lt;/span&gt;
          &lt;/button&gt;
          &lt;button class=&quot;lc-type-btn&quot; type=&quot;button&quot; data-add-type=&quot;video&quot;&gt;
            &lt;span class=&quot;lc-type-symbol&quot;&gt;▶&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;lc-type-name&quot;&gt;视频节点&lt;/span&gt;&lt;span class=&quot;lc-type-desc&quot;&gt;首帧、尾帧与视频生成&lt;/span&gt;&lt;/span&gt;
          &lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;lc-prompt-dock&quot; data-role=&quot;dock&quot;&gt;
        &lt;div class=&quot;lc-prompt-inner&quot;&gt;
          &lt;div class=&quot;lc-prompt-main&quot;&gt;
            &lt;div class=&quot;lc-prompt-context&quot;&gt;
              &lt;span class=&quot;lc-context-label&quot; data-role=&quot;dock-title&quot;&gt;当前节点&lt;/span&gt;
              &lt;span class=&quot;lc-ref-chip&quot; data-role=&quot;dock-ref&quot;&gt;无上游&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;lc-prompt-row&quot;&gt;
              &lt;textarea class=&quot;lc-prompt-input&quot; data-role=&quot;prompt&quot; aria-label=&quot;当前节点提示词&quot; placeholder=&quot;描述希望当前节点完成什么…&quot;&gt;&lt;/textarea&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;button class=&quot;lc-run-btn&quot; type=&quot;button&quot; data-action=&quot;run&quot; aria-label=&quot;运行当前节点&quot;&gt;↑&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;lc-toast&quot; data-role=&quot;toast&quot;&gt;已完成&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;lc-node-lab-v2&#x27;);
      if (!root) return;
      const stage = root.querySelector(&#x27;[data-role=&quot;stage&quot;]&#x27;);
      const world = root.querySelector(&#x27;[data-role=&quot;world&quot;]&#x27;);
      const nodeLayer = root.querySelector(&#x27;[data-role=&quot;nodes&quot;]&#x27;);
      const linksLayer = root.querySelector(&#x27;[data-role=&quot;links&quot;]&#x27;);
      const menu = root.querySelector(&#x27;[data-role=&quot;menu&quot;]&#x27;);
      const menuTitle = root.querySelector(&#x27;[data-role=&quot;menu-title&quot;]&#x27;);
      const directionRow = root.querySelector(&#x27;[data-role=&quot;direction-row&quot;]&#x27;);
      const dock = root.querySelector(&#x27;[data-role=&quot;dock&quot;]&#x27;);
      const dockTitle = root.querySelector(&#x27;[data-role=&quot;dock-title&quot;]&#x27;);
      const dockRef = root.querySelector(&#x27;[data-role=&quot;dock-ref&quot;]&#x27;);
      const promptInput = root.querySelector(&#x27;[data-role=&quot;prompt&quot;]&#x27;);
      const runButton = root.querySelector(&#x27;[data-action=&quot;run&quot;]&#x27;);
      const toast = root.querySelector(&#x27;[data-role=&quot;toast&quot;]&#x27;);
      const zoomLabel = root.querySelector(&#x27;[data-role=&quot;zoom-label&quot;]&#x27;);
      const fileInput = root.querySelector(&#x27;[data-role=&quot;file-input&quot;]&#x27;);

      const copy = value =&gt; JSON.parse(JSON.stringify(value));
      const initialNodes = [
        { id: &#x27;n1&#x27;, type: &#x27;text&#x27;, title: &#x27;场景描述&#x27;, x: 92, y: 180, ratio: &#x27;auto&#x27;, model: &#x27;GPT-5&#x27;, prompt: &#x27;雨后的东京街头，霓虹灯映在湿润路面上。镜头低机位，电影感，保持克制的蓝紫色调。&#x27;, status: &#x27;ready&#x27;, variant: 0 },
        { id: &#x27;n2&#x27;, type: &#x27;image&#x27;, title: &#x27;主视觉&#x27;, x: 430, y: 152, ratio: &#x27;4:5&#x27;, model: &#x27;Image Pro&#x27;, prompt: &#x27;参考上游场景描述，生成电影海报级主视觉，人物背对镜头，环境细节清晰。&#x27;, status: &#x27;ready&#x27;, variant: 0 },
        { id: &#x27;n3&#x27;, type: &#x27;video&#x27;, title: &#x27;镜头运动&#x27;, x: 820, y: 190, ratio: &#x27;16:9&#x27;, model: &#x27;Video Pro&#x27;, prompt: &#x27;以主视觉作为首帧，缓慢向前推进，路面反光轻微流动，远处车辆掠过。&#x27;, status: &#x27;idle&#x27;, variant: 0 }
      ];
      const initialEdges = [
        { id: &#x27;e1&#x27;, source: &#x27;n1&#x27;, target: &#x27;n2&#x27; },
        { id: &#x27;e2&#x27;, source: &#x27;n2&#x27;, target: &#x27;n3&#x27; }
      ];
      let nodes = copy(initialNodes);
      let edges = copy(initialEdges);
      let selectedId = &#x27;n2&#x27;;
      let zoom = 1;
      let pan = { x: 0, y: 0 };
      let menuState = null;
      let branch = &#x27;up&#x27;;
      let dragState = null;
      let panState = null;
      let spaceDown = false;
      let toastTimer = null;
      let uploadTargetId = null;
      let dropTargetEl = null;

      const escapeHtml = value =&gt; String(value ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&#x27;&quot;]/g, char =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27; }[char]));
      const nodeById = id =&gt; nodes.find(node =&gt; node.id === id);
      const inbound = id =&gt; edges.filter(edge =&gt; edge.target === id).map(edge =&gt; nodeById(edge.source)).filter(Boolean);
      const outbound = id =&gt; edges.filter(edge =&gt; edge.source === id).map(edge =&gt; nodeById(edge.target)).filter(Boolean);
      const ratioParts = ratio =&gt; {
        if (!ratio || ratio === &#x27;auto&#x27;) return [4, 3];
        const parts = ratio.split(&#x27;:&#x27;).map(Number);
        return parts.length === 2 &amp;&amp; parts.every(Boolean) ? parts : [4, 3];
      };
      const mediaSize = (node, expanded) =&gt; {
        const [rw, rh] = ratioParts(node.ratio);
        const maxW = expanded ? 276 : (node.type === &#x27;video&#x27; ? 250 : 190);
        const maxH = expanded ? 230 : (node.type === &#x27;video&#x27; ? 188 : 250);
        let width = maxW;
        let height = width * rh / rw;
        if (height &gt; maxH) { height = maxH; width = height * rw / rh; }
        return { width: Math.round(width), height: Math.round(height) };
      };
      const nodeSize = (node, expanded = node.id === selectedId) =&gt; {
        if (!expanded) {
          if (node.type === &#x27;text&#x27;) return { width: 214, height: 118 };
          return mediaSize(node, false);
        }
        if (node.type === &#x27;text&#x27;) return { width: 292, height: 196 };
        const media = mediaSize(node, true);
        return { width: Math.max(300, media.width + 20), height: media.height + 54, media };
      };
      const typeLabel = type =&gt; ({ text: &#x27;文本&#x27;, image: &#x27;图片&#x27;, video: &#x27;视频&#x27; }[type] || type);
      const relationLabel = edge =&gt; {
        const source = nodeById(edge.source);
        const target = nodeById(edge.target);
        if (!source || !target) return &#x27;输入&#x27;;
        if (source.type === &#x27;text&#x27;) return &#x27;描述&#x27;;
        if (source.type === &#x27;image&#x27; &amp;&amp; target.type === &#x27;video&#x27;) return &#x27;首帧&#x27;;
        if (source.type === &#x27;image&#x27;) return &#x27;参考&#x27;;
        if (source.type === &#x27;video&#x27; &amp;&amp; target.type === &#x27;text&#x27;) return &#x27;解析&#x27;;
        return &#x27;输入&#x27;;
      };
      function collapsedMarkup(node) {
        if (node.type === &#x27;text&#x27;) {
          return `&lt;div class=&quot;lc-bare&quot;&gt;&lt;span class=&quot;lc-bare-kicker&quot;&gt;${escapeHtml(node.title)}&lt;/span&gt;&lt;span class=&quot;lc-bare-copy&quot;&gt;${escapeHtml(node.prompt)}&lt;/span&gt;&lt;/div&gt;`;
        }
        if (node.mediaUrl) {
          const media = node.type === &#x27;video&#x27;
            ? `&lt;video class=&quot;lc-uploaded-media&quot; src=&quot;${escapeHtml(node.mediaUrl)}&quot; muted loop autoplay playsinline&gt;&lt;/video&gt;`
            : `&lt;img class=&quot;lc-uploaded-media&quot; src=&quot;${escapeHtml(node.mediaUrl)}&quot; alt=&quot;${escapeHtml(node.fileName || node.title)}&quot;&gt;`;
          return `&lt;div class=&quot;lc-bare&quot;&gt;${media}&lt;/div&gt;`;
        }
        const videoClass = node.type === &#x27;video&#x27; ? &#x27; lc-video-art&#x27; : &#x27;&#x27;;
        const alt = node.variant % 2 ? &#x27; alt&#x27; : &#x27;&#x27;;
        return `&lt;div class=&quot;lc-bare&quot;&gt;&lt;div class=&quot;lc-media-art${videoClass}${alt}&quot;&gt;${node.type === &#x27;video&#x27; ? &#x27;&lt;span class=&quot;lc-duration&quot;&gt;06s&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
      }

      function expandedMarkup(node, size) {
        const uploadedMedia = node.mediaUrl
          ? (node.type === &#x27;video&#x27;
            ? `&lt;video class=&quot;lc-uploaded-media&quot; src=&quot;${escapeHtml(node.mediaUrl)}&quot; controls muted loop playsinline&gt;&lt;/video&gt;`
            : `&lt;img class=&quot;lc-uploaded-media&quot; src=&quot;${escapeHtml(node.mediaUrl)}&quot; alt=&quot;${escapeHtml(node.fileName || node.title)}&quot;&gt;`)
          : null;
        const content = node.type === &#x27;text&#x27;
          ? `&lt;div class=&quot;lc-expanded-copy&quot;&gt;${escapeHtml(node.prompt)}&lt;/div&gt;`
          : `&lt;div class=&quot;lc-expanded-content&quot; style=&quot;width:${size.media.width}px;height:${size.media.height}px;margin:0 auto&quot;&gt;${uploadedMedia || `&lt;div class=&quot;lc-media-art${node.type === &#x27;video&#x27; ? &#x27; lc-video-art&#x27; : &#x27;&#x27;}${node.variant % 2 ? &#x27; alt&#x27; : &#x27;&#x27;}&quot;&gt;${node.type === &#x27;video&#x27; ? &#x27;&lt;span class=&quot;lc-duration&quot;&gt;06s&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/div&gt;`}&lt;/div&gt;`;
        return `&lt;div class=&quot;lc-expanded-panel&quot;&gt;
          &lt;div class=&quot;lc-node-head&quot;&gt;
            &lt;div class=&quot;lc-node-title&quot;&gt;&lt;span class=&quot;lc-type-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;${escapeHtml(node.title)}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;lc-node-actions&quot;&gt;
              ${node.type !== &#x27;text&#x27; ? &#x27;&lt;button class=&quot;lc-mini-btn lc-upload-label&quot; type=&quot;button&quot; data-node-action=&quot;upload&quot; aria-label=&quot;上传本地媒体&quot;&gt;↑ 上传&lt;/button&gt;&#x27; : &#x27;&#x27;}
              &lt;button class=&quot;lc-mini-btn&quot; type=&quot;button&quot; data-node-action=&quot;duplicate&quot; aria-label=&quot;复制节点&quot;&gt;⧉&lt;/button&gt;
              &lt;button class=&quot;lc-mini-btn&quot; type=&quot;button&quot; data-node-action=&quot;delete&quot; aria-label=&quot;删除节点&quot;&gt;×&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          ${content}
          &lt;button class=&quot;lc-port lc-port-left&quot; type=&quot;button&quot; data-port=&quot;left&quot; data-side-label=&quot;添加上游&quot; aria-label=&quot;添加上游节点&quot;&gt;&lt;span&gt;＋&lt;/span&gt;&lt;/button&gt;
          &lt;button class=&quot;lc-port lc-port-right&quot; type=&quot;button&quot; data-port=&quot;right&quot; data-side-label=&quot;添加下游&quot; aria-label=&quot;添加下游节点&quot;&gt;&lt;span&gt;＋&lt;/span&gt;&lt;/button&gt;
        &lt;/div&gt;`;
      }

      function renderNodes() {
        nodeLayer.innerHTML = nodes.map(node =&gt; {
          const expanded = node.id === selectedId;
          const size = nodeSize(node, expanded);
          return `&lt;article class=&quot;lc-node${expanded ? &#x27; is-expanded&#x27; : &#x27;&#x27;}${node.status === &#x27;running&#x27; ? &#x27; is-running&#x27; : &#x27;&#x27;}&quot; data-node-id=&quot;${node.id}&quot; data-type=&quot;${node.type}&quot; style=&quot;left:${node.x}px;top:${node.y}px;width:${size.width}px;height:${size.height}px&quot; aria-label=&quot;${escapeHtml(typeLabel(node.type) + &#x27;节点：&#x27; + node.title)}&quot;&gt;
            ${expanded ? expandedMarkup(node, size) : collapsedMarkup(node)}
          &lt;/article&gt;`;
        }).join(&#x27;&#x27;);
        renderLinks();
      }

      function renderLinks() {
        linksLayer.innerHTML = edges.map(edge =&gt; {
          const source = nodeById(edge.source);
          const target = nodeById(edge.target);
          if (!source || !target) return &#x27;&#x27;;
          const ss = nodeSize(source);
          const ts = nodeSize(target);
          const sx = source.x + ss.width;
          const sy = source.y + ss.height / 2;
          const tx = target.x;
          const ty = target.y + ts.height / 2;
          const bend = Math.max(60, Math.abs(tx - sx) * .45);
          const path = `M ${sx} ${sy} C ${sx + bend} ${sy}, ${tx - bend} ${ty}, ${tx} ${ty}`;
          const mx = (sx + tx) / 2;
          const my = (sy + ty) / 2;
          const label = relationLabel(edge);
          const active = edge.source === selectedId || edge.target === selectedId;
          return `&lt;g&gt;&lt;path class=&quot;lc-link-path${active ? &#x27; is-active&#x27; : &#x27;&#x27;}&quot; d=&quot;${path}&quot;/&gt;&lt;circle class=&quot;lc-link-dot&quot; cx=&quot;${sx}&quot; cy=&quot;${sy}&quot; r=&quot;4&quot;/&gt;&lt;circle class=&quot;lc-link-dot&quot; cx=&quot;${tx}&quot; cy=&quot;${ty}&quot; r=&quot;4&quot;/&gt;&lt;g class=&quot;lc-link-label&quot; transform=&quot;translate(${mx - 22} ${my - 10})&quot;&gt;&lt;rect width=&quot;44&quot; height=&quot;20&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;22&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;${label}&lt;/text&gt;&lt;/g&gt;&lt;/g&gt;`;
        }).join(&#x27;&#x27;);
      }

      function renderDock() {
        const node = nodeById(selectedId);
        dock.classList.toggle(&#x27;is-visible&#x27;, Boolean(node));
        if (!node) return;
        dockTitle.textContent = `${typeLabel(node.type)} · ${node.title}`;
        const sources = inbound(node.id);
        dockRef.textContent = sources.length ? `引用 ${sources.length} 个上游` : &#x27;无上游&#x27;;
        promptInput.value = node.prompt;
        runButton.disabled = node.status === &#x27;running&#x27;;
        runButton.textContent = node.status === &#x27;running&#x27; ? &#x27;···&#x27; : &#x27;↑&#x27;;
      }

      function renderWorld() {
        world.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
        renderNodes();
        renderDock();
      }

      function selectNode(id) {
        selectedId = id;
        closeMenu();
        renderNodes();
        renderDock();
      }

      function closeMenu() {
        menu.hidden = true;
        menuState = null;
      }

      function openMenu(clientX, clientY, state) {
        const rect = stage.getBoundingClientRect();
        menuState = state;
        branch = &#x27;up&#x27;;
        menu.style.left = `${Math.min(rect.width - 248, Math.max(10, clientX - rect.left))}px`;
        menu.style.top = `${Math.min(rect.height - 250, Math.max(58, clientY - rect.top))}px`;
        const fromPort = state?.kind === &#x27;port&#x27;;
        directionRow.hidden = !fromPort;
        menuTitle.textContent = fromPort ? (state.side === &#x27;left&#x27; ? &#x27;添加上游节点&#x27; : &#x27;添加下游节点&#x27;) : &#x27;在此处添加节点&#x27;;
        root.querySelectorAll(&#x27;[data-branch]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.branch === branch));
        menu.hidden = false;
      }

      function addNode(type) {
        if (!menuState) return;
        const id = `n${Date.now().toString(36)}`;
        const defaults = {
          text: { title: &#x27;新文本&#x27;, ratio: &#x27;auto&#x27;, model: &#x27;GPT-5&#x27;, prompt: &#x27;写下场景、脚本或生成要求…&#x27; },
          image: { title: &#x27;新图片&#x27;, ratio: &#x27;1:1&#x27;, model: &#x27;Image Pro&#x27;, prompt: &#x27;描述希望生成的画面，可继续引用上游节点。&#x27; },
          video: { title: &#x27;新视频&#x27;, ratio: &#x27;16:9&#x27;, model: &#x27;Video Pro&#x27;, prompt: &#x27;描述镜头运动、时长和画面变化。&#x27; }
        }[type];
        let x;
        let y;
        if (menuState.kind === &#x27;blank&#x27;) {
          x = (menuState.x - pan.x) / zoom;
          y = (menuState.y - pan.y) / zoom;
        } else {
          const anchor = nodeById(menuState.anchorId);
          const anchorSize = nodeSize(anchor);
          const newProbe = { type, ratio: defaults.ratio };
          const newSize = nodeSize(newProbe, false);
          x = menuState.side === &#x27;right&#x27; ? anchor.x + anchorSize.width + 150 : anchor.x - newSize.width - 150;
          y = anchor.y + (branch === &#x27;up&#x27; ? -150 : 170);
        }
        const node = { id, type, x, y, status: &#x27;idle&#x27;, variant: 0, ...defaults };
        nodes.push(node);
        const createdFromPort = menuState.kind === &#x27;port&#x27;;
        if (createdFromPort) {
          if (menuState.side === &#x27;right&#x27;) edges.push({ id: `e${Date.now().toString(36)}`, source: menuState.anchorId, target: id });
          else edges.push({ id: `e${Date.now().toString(36)}`, source: id, target: menuState.anchorId });
        }
        selectedId = id;
        closeMenu();
        renderWorld();
        showToast(createdFromPort ? &#x27;节点已创建并自动连接&#x27; : &#x27;节点已创建&#x27;);
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add(&#x27;is-visible&#x27;);
        toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 1500);
      }

      function duplicateNode(id) {
        const source = nodeById(id);
        if (!source) return;
        const newId = `n${Date.now().toString(36)}`;
        nodes.push({ ...copy(source), id: newId, x: source.x + 44, y: source.y + 44, title: `${source.title} 副本`, status: &#x27;idle&#x27; });
        selectedId = newId;
        renderWorld();
        showToast(&#x27;已创建副本&#x27;);
      }

      function deleteNode(id) {
        nodes = nodes.filter(node =&gt; node.id !== id);
        edges = edges.filter(edge =&gt; edge.source !== id &amp;&amp; edge.target !== id);
        selectedId = null;
        renderWorld();
        showToast(&#x27;节点已删除&#x27;);
      }

      function openUploadPicker(id) {
        const node = nodeById(id);
        if (!node || node.type === &#x27;text&#x27;) return;
        uploadTargetId = id;
        fileInput.accept = node.type === &#x27;image&#x27; ? &#x27;image/*&#x27; : &#x27;video/*&#x27;;
        fileInput.value = &#x27;&#x27;;
        fileInput.click();
      }

      function fitUploadedRatio(node, url) {
        if (node.type === &#x27;image&#x27;) {
          const probe = new Image();
          probe.onload = () =&gt; {
            const current = nodeById(node.id);
            if (!current || current.mediaUrl !== url) return;
            current.ratio = `${probe.naturalWidth}:${probe.naturalHeight}`;
            renderWorld();
          };
          probe.src = url;
          return;
        }
        const probe = document.createElement(&#x27;video&#x27;);
        probe.preload = &#x27;metadata&#x27;;
        probe.onloadedmetadata = () =&gt; {
          const current = nodeById(node.id);
          if (!current || current.mediaUrl !== url) return;
          current.ratio = `${probe.videoWidth}:${probe.videoHeight}`;
          renderWorld();
        };
        probe.src = url;
      }

      function handleUploadFile(file, id) {
        const node = nodeById(id);
        if (!node || !file) return;
        const expected = node.type === &#x27;image&#x27; ? &#x27;image/&#x27; : &#x27;video/&#x27;;
        if (!file.type.startsWith(expected)) {
          showToast(node.type === &#x27;image&#x27; ? &#x27;请选择图片文件&#x27; : &#x27;请选择视频文件&#x27;);
          return;
        }
        const url = URL.createObjectURL(file);
        node.mediaUrl = url;
        node.fileName = file.name;
        node.status = &#x27;ready&#x27;;
        selectedId = node.id;
        fitUploadedRatio(node, url);
        renderWorld();
        showToast(`${typeLabel(node.type)}已上传，可拖入其他文件替换`);
      }

      function runCurrent() {
        const node = nodeById(selectedId);
        if (!node || node.status === &#x27;running&#x27;) return;
        node.prompt = promptInput.value.trim() || node.prompt;
        node.status = &#x27;running&#x27;;
        renderWorld();
        setTimeout(() =&gt; {
          const current = nodeById(node.id);
          if (!current) return;
          current.status = &#x27;ready&#x27;;
          current.variant += 1;
          renderWorld();
          showToast(`${typeLabel(current.type)}节点生成完成`);
        }, 1250);
      }

      function resetDemo() {
        nodes = copy(initialNodes);
        edges = copy(initialEdges);
        selectedId = &#x27;n2&#x27;;
        zoom = 1;
        pan = { x: 0, y: 0 };
        closeMenu();
        renderWorld();
        showToast(&#x27;示例已重置&#x27;);
      }

      nodeLayer.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
        const nodeEl = event.target.closest(&#x27;[data-node-id]&#x27;);
        if (!nodeEl || event.target.closest(&#x27;button, video&#x27;)) return;
        const id = nodeEl.dataset.nodeId;
        const node = nodeById(id);
        if (!node) return;
        if (selectedId !== id) selectNode(id);
        dragState = { id, startX: event.clientX, startY: event.clientY, nodeX: node.x, nodeY: node.y, moved: false };
        nodeEl.setPointerCapture?.(event.pointerId);
        event.stopPropagation();
      });

      nodeLayer.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
        if (!dragState) return;
        const node = nodeById(dragState.id);
        if (!node) return;
        const dx = (event.clientX - dragState.startX) / zoom;
        const dy = (event.clientY - dragState.startY) / zoom;
        if (Math.abs(dx) + Math.abs(dy) &gt; 3) dragState.moved = true;
        node.x = dragState.nodeX + dx;
        node.y = dragState.nodeY + dy;
        const el = nodeLayer.querySelector(`[data-node-id=&quot;${dragState.id}&quot;]`);
        if (el) { el.style.left = `${node.x}px`; el.style.top = `${node.y}px`; }
        renderLinks();
      });

      nodeLayer.addEventListener(&#x27;pointerup&#x27;, event =&gt; {
        if (!dragState) return;
        const moved = dragState.moved;
        const id = dragState.id;
        dragState = null;
        if (!moved) selectNode(id);
        event.stopPropagation();
      });

      nodeLayer.addEventListener(&#x27;click&#x27;, event =&gt; {
        const port = event.target.closest(&#x27;[data-port]&#x27;);
        const nodeEl = event.target.closest(&#x27;[data-node-id]&#x27;);
        if (port &amp;&amp; nodeEl) {
          event.stopPropagation();
          openMenu(event.clientX, event.clientY, { kind: &#x27;port&#x27;, anchorId: nodeEl.dataset.nodeId, side: port.dataset.port });
          return;
        }
        const action = event.target.closest(&#x27;[data-node-action]&#x27;);
        if (action &amp;&amp; nodeEl) {
          event.stopPropagation();
          if (action.dataset.nodeAction === &#x27;upload&#x27;) openUploadPicker(nodeEl.dataset.nodeId);
          if (action.dataset.nodeAction === &#x27;duplicate&#x27;) duplicateNode(nodeEl.dataset.nodeId);
          if (action.dataset.nodeAction === &#x27;delete&#x27;) deleteNode(nodeEl.dataset.nodeId);
          return;
        }
        if (nodeEl) selectNode(nodeEl.dataset.nodeId);
      });

      fileInput.addEventListener(&#x27;change&#x27;, () =&gt; {
        handleUploadFile(fileInput.files?.[0], uploadTargetId);
      });

      nodeLayer.addEventListener(&#x27;dragover&#x27;, event =&gt; {
        const nodeEl = event.target.closest(&#x27;[data-node-id]&#x27;);
        const node = nodeEl ? nodeById(nodeEl.dataset.nodeId) : null;
        if (!nodeEl || !node || node.type === &#x27;text&#x27;) return;
        event.preventDefault();
        if (dropTargetEl !== nodeEl) {
          dropTargetEl?.classList.remove(&#x27;is-drop-target&#x27;);
          dropTargetEl = nodeEl;
          dropTargetEl.classList.add(&#x27;is-drop-target&#x27;);
        }
      });

      nodeLayer.addEventListener(&#x27;dragleave&#x27;, event =&gt; {
        if (dropTargetEl &amp;&amp; !dropTargetEl.contains(event.relatedTarget)) {
          dropTargetEl.classList.remove(&#x27;is-drop-target&#x27;);
          dropTargetEl = null;
        }
      });

      nodeLayer.addEventListener(&#x27;drop&#x27;, event =&gt; {
        const nodeEl = event.target.closest(&#x27;[data-node-id]&#x27;);
        const node = nodeEl ? nodeById(nodeEl.dataset.nodeId) : null;
        dropTargetEl?.classList.remove(&#x27;is-drop-target&#x27;);
        dropTargetEl = null;
        if (!nodeEl || !node || node.type === &#x27;text&#x27;) return;
        event.preventDefault();
        handleUploadFile(event.dataTransfer?.files?.[0], node.id);
      });

      stage.addEventListener(&#x27;click&#x27;, event =&gt; {
        if (event.target.closest(&#x27;.lc-node, .lc-menu, .lc-prompt-dock, .lc-topbar&#x27;)) return;
        selectedId = null;
        closeMenu();
        renderNodes();
        renderDock();
      });

      stage.addEventListener(&#x27;dblclick&#x27;, event =&gt; {
        if (event.target.closest(&#x27;.lc-node, .lc-menu, .lc-prompt-dock, .lc-topbar&#x27;)) return;
        event.preventDefault();
        const rect = stage.getBoundingClientRect();
        openMenu(event.clientX, event.clientY, { kind: &#x27;blank&#x27;, x: event.clientX - rect.left, y: event.clientY - rect.top });
      });

      stage.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
        if (event.target.closest(&#x27;.lc-node, .lc-menu, .lc-prompt-dock, .lc-topbar&#x27;)) return;
        if (event.button === 1 || spaceDown) {
          panState = { x: event.clientX, y: event.clientY, panX: pan.x, panY: pan.y };
          stage.classList.add(&#x27;is-panning&#x27;);
          event.preventDefault();
        }
      });
      stage.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
        if (!panState) return;
        pan.x = panState.panX + event.clientX - panState.x;
        pan.y = panState.panY + event.clientY - panState.y;
        world.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
      });
      stage.addEventListener(&#x27;pointerup&#x27;, () =&gt; { panState = null; stage.classList.remove(&#x27;is-panning&#x27;); });
      stage.addEventListener(&#x27;pointerleave&#x27;, () =&gt; { panState = null; stage.classList.remove(&#x27;is-panning&#x27;); });

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const addType = event.target.closest(&#x27;[data-add-type]&#x27;);
        if (addType) { addNode(addType.dataset.addType); return; }
        const branchButton = event.target.closest(&#x27;[data-branch]&#x27;);
        if (branchButton) {
          branch = branchButton.dataset.branch;
          root.querySelectorAll(&#x27;[data-branch]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.branch === branch));
          return;
        }
        const action = event.target.closest(&#x27;[data-action]&#x27;)?.dataset.action;
        if (action === &#x27;run&#x27;) runCurrent();
        if (action === &#x27;reset&#x27;) resetDemo();
        if (action === &#x27;zoom-in&#x27;) { zoom = Math.min(1.35, zoom + .1); renderWorld(); }
        if (action === &#x27;zoom-out&#x27;) { zoom = Math.max(.65, zoom - .1); renderWorld(); }
        if (action === &#x27;toolbar-add&#x27;) {
          const rect = stage.getBoundingClientRect();
          openMenu(rect.left + 68, rect.top + rect.height / 2 - 110, { kind: &#x27;blank&#x27;, x: 150, y: rect.height / 2 - 90 });
        }
      });

      promptInput.addEventListener(&#x27;input&#x27;, () =&gt; {
        const node = nodeById(selectedId);
        if (node) node.prompt = promptInput.value;
      });
      window.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.code === &#x27;Space&#x27; &amp;&amp; !event.target.matches(&#x27;textarea, input, select&#x27;)) spaceDown = true;
        if ((event.key === &#x27;Delete&#x27; || event.key === &#x27;Backspace&#x27;) &amp;&amp; selectedId &amp;&amp; !event.target.matches(&#x27;textarea, input&#x27;)) deleteNode(selectedId);
        if (event.key === &#x27;Escape&#x27;) { selectedId = null; closeMenu(); renderNodes(); renderDock(); }
      });
      window.addEventListener(&#x27;keyup&#x27;, event =&gt; { if (event.code === &#x27;Space&#x27;) spaceDown = false; });

      renderWorld();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

[package]
name = "ling-canvas"
version = "0.1.5"
description = "Ling Canvas - AI Creative Canvas"
authors = ["Ling Canvas"]
edition = "2021"

[lib]
name = "ling_canvas_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

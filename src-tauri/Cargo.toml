[package]
name = "ling-canvas"
version = "0.1.5"
description = "Ling Canvas - AI Creative Canvas"
authors = ["Ling Canvas"]
edition = "2021"

[lib]
name = "ling_canvas_lib"
# cdylib/staticlib 仅 Tauri 移动端需要；windows-gnu 下链接 cdylib 会触发
# ld "export ordinal too large"，桌面端只保留 rlib。
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

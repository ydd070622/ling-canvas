[package]
name = "ling-canvas"
version = "2.1.3"
description = "Ling Canvas - AI Creative Canvas"
authors = ["Ling Canvas"]
edition = "2021"

[lib]
name = "ling_canvas_lib"
# cdylib/staticlib 仅 Tauri 移动端需要；windows-gnu 下链接 cdylib 会触发
# ld "export ordinal too large"，桌面端只保留 rlib。
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["sync", "macros"] }
